<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>튼튼이 365</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first single column app; challenge mode widens to camera + guide side by side */
/* 색: 튼튼이 365 메인 그림(하늘색 배경, 남색 제목, 초록 365, 파란 버튼)에 맞춤 */
:root{
  --bg:#EEF5FC; --surface:#FFFFFF; --surface-2:#E3EDF8; --ink:#1B2F55; --muted:#5B6A82; --line:#D3E0EE;
  --accent:#2F5FD0; --accent-ink:#FFFFFF; --accent-soft:#DCE6FB;
  --teal:#1F9D57; --teal-soft:#D6F1E1; --sun:#E9A817; --sun-soft:#FDF0CC; --warn:#B4541F;
  --navy:#1F3F7A; --sky-1:#F7FBFF; --sky-2:#D9E9FA; --hill:#C7DDF5; --deco:#A9CBF0; --glow:#FFFFFF; --leaf:#4DB565;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#16213A; --surface-2:#1F2C48; --ink:#E6EEFA; --muted:#9CB0CF; --line:#2A3A5C;
  --accent:#6F9BFF; --accent-ink:#0B1530; --accent-soft:#1F2E55;
  --teal:#4CC88A; --teal-soft:#173B2B; --sun:#F7C24A; --sun-soft:#3A3120; --warn:#F09A6B;
  --navy:#BFD3FF; --sky-1:#1A2A48; --sky-2:#12203A; --hill:#1E3358; --deco:#3D5A88; --glow:#24375C; --leaf:#3E9A57; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#16213A; --surface-2:#1F2C48; --ink:#E6EEFA; --muted:#9CB0CF; --line:#2A3A5C;
  --accent:#6F9BFF; --accent-ink:#0B1530; --accent-soft:#1F2E55;
  --teal:#4CC88A; --teal-soft:#173B2B; --sun:#F7C24A; --sun-soft:#3A3120; --warn:#F09A6B;
  --navy:#BFD3FF; --sky-1:#1A2A48; --sky-2:#12203A; --hill:#1E3358; --deco:#3D5A88; --glow:#24375C; --leaf:#3E9A57; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:26px;line-height:1.25}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--teal)}
.app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:16px}
body.wide .app{max-width:1000px}
.col{display:flex;flex-direction:column;gap:16px}

/* status */
.status{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px}
.status .lv{font-family:var(--display);font-size:18px;white-space:nowrap}
.xpbar{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.xpbar small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.xpbar small .warn{color:var(--warn)}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s}
.flame{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:18px;color:var(--sun);font-variant-numeric:tabular-nums}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px;text-align:center}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 16px;font-family:var(--display);font-size:18px;position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.dot.on{background:var(--sun)}
.day.today span{color:var(--ink);font-weight:700}
.cta{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:21px;padding:16px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.mascot{height:auto;display:block}
/* 첫 화면: 6-3 방패 + 제목, 곰돌이 장면, 메뉴 4칸, 시작 버튼 */
.brand{display:flex;align-items:center;justify-content:center;gap:8px;padding-top:2px}
.brand .crest{flex:none;width:64px;height:58px}
.brand h1{font-size:36px;line-height:1.05;color:var(--navy)}
.brand h1 em{font-style:normal;color:var(--teal);margin-left:6px}
.brand p{font-size:13px;color:var(--muted);margin-top:3px}
.homehead{display:flex;flex-direction:column}
.scene{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,var(--sky-1),var(--sky-2));min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-top:16px}
.scene .deco{position:absolute;inset:0;width:100%;height:100%}
.scene .bubble{z-index:1;margin-bottom:12px;max-width:88%}
.scene .mascot{position:relative;z-index:1;width:min(230px,58%);transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03) rotate(-1.5deg)}}
.menu4{position:relative;z-index:2;margin:-14px 10px 0;background:var(--surface);border-radius:22px;box-shadow:0 8px 24px rgba(31,63,122,.13);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:14px 4px 40px}
.menu4 button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);padding:4px 2px;min-width:0;white-space:nowrap}
.menu4 button + button{border-left:1px solid var(--line)}
.menu4 .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 14%,transparent)}
.menu4 .mi svg{width:26px;height:26px}
.startpill{position:relative;z-index:3;margin:-27px auto 0;width:min(330px,86%);border:0;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent));color:var(--accent-ink);font-family:var(--display);font-size:20px;padding:13px 18px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.startpill:active{transform:translateY(2px)}
.slogan{text-align:center;font-family:var(--display);font-size:17px;color:var(--navy)}
@media (prefers-reduced-motion: reduce){.scene .mascot{animation:none}}

/* check-in */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--surface-2)}
.steps i.on{background:var(--teal)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--muted);padding:4px 0;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal)}
.opt b{display:block;font-size:16px}
.opt small{color:var(--muted);font-size:13px}
.opt.ch .ic{background:var(--accent-soft);color:var(--accent)}
.xp{margin-left:auto;flex:none;font-family:var(--display);font-size:15px;color:var(--teal);white-space:nowrap}
.opt.ch .xp{color:var(--accent)}

/* result */
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.chip{background:var(--teal-soft);color:var(--teal);border-radius:99px;padding:4px 10px;font-weight:700}
.chip.end{background:var(--accent-soft);color:var(--accent)}
.arrow{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steplist li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.steplist .n{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700}
.steplist .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cam-ic{display:inline-flex;vertical-align:-3px;color:var(--accent);margin-left:4px}
.vlink{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:700;text-decoration:none}
.vlink:hover{text-decoration:underline}
.note{font-size:12px;color:var(--muted)}
.err{color:var(--warn);font-weight:500;font-size:14px}

/* player */
.pgrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:760px){body.wide .pgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.stage{position:relative;background:var(--surface-2);border-radius:20px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.stage canvas{width:100%;height:100%;display:block}
.pill{position:absolute;left:12px;top:12px;border-radius:99px;padding:6px 14px;font-weight:700;font-size:15px;background:var(--surface);color:var(--muted)}
.pill.ok{background:var(--teal);color:#fff}
.embed{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.embed iframe{width:100%;height:100%;border:0;display:block}
/* 우리 반 영상 파일: 누르면 멈춤/재생, 멈춰 있으면 가운데 ▶, 오른쪽 아래 크게 보기 */
.embed video{width:100%;height:100%;display:block;background:#000;object-fit:contain;cursor:pointer}
.embed .vplay{position:absolute;inset:0;margin:auto;width:84px;height:84px;padding:0 0 0 6px;border:0;border-radius:50%;background:rgba(15,23,42,.72);color:#fff;display:grid;place-items:center;cursor:pointer}
.embed.on .vplay,.embed.err .vplay{display:none}
.embed .vfull{position:absolute;left:10px;bottom:10px;border:0;border-radius:99px;padding:6px 12px;background:rgba(15,23,42,.72);color:#fff;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.embed.vid:fullscreen{border-radius:0;aspect-ratio:auto;background:#000}
@media (max-width:520px){.embed .vfull{padding:7px}.embed .vfull span{display:none}}
@media (min-width:760px){body.wide .pgrid.vid{grid-template-columns:minmax(0,2fr) minmax(240px,1fr)}}
.bigtitle,.cue{word-break:keep-all}
.guide{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.kind{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--teal-soft);color:var(--teal)}
.kind.cam{background:var(--accent-soft);color:var(--accent)}
.bigtitle{font-size:clamp(26px,4.5vw,40px);line-height:1.2}
.cue{font-size:17px;max-width:34ch}
.ring{position:relative;width:180px;height:180px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:60px;font-variant-numeric:tabular-nums}
.pdots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.pdots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2)}
.pdots i.done{background:var(--teal)}
.pdots i.skip{background:var(--line);outline:1px solid var(--muted)}
.pdots i.now{background:var(--accent)}
.row{display:flex;gap:10px;width:100%;flex-wrap:wrap}
.row > *{flex:1}
.conf{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.bar{display:grid;grid-template-columns:minmax(0,6.5em) 1fr 3em;gap:8px;align-items:center;font-size:13px}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{position:relative;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .t i{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:99px}
.bar.target{font-weight:700}
.bar.target .t i{background:var(--accent)}
.bar.target.ok .t i{background:var(--teal)}
.bar .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hold{width:100%;border:0;border-radius:16px;background:var(--teal);color:#fff;font-family:var(--display);font-size:19px;padding:14px;touch-action:none;user-select:none}

/* feel + done */
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel button{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.feel button:hover{border-color:var(--teal)}
.face{width:48px;height:48px}
.gain{font-family:var(--display);font-size:40px;color:var(--teal)}
.breakdown{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;text-align:left;font-variant-numeric:tabular-nums}
.breakdown dt{color:var(--muted)}
.breakdown dd{margin:0;font-weight:700;text-align:right}
.newbadge{background:var(--sun-soft);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}

/* badges: 배지마다 색과 그림, 못 받은 배지는 진행도 */
.medal{--bd:var(--surface-2);flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:color-mix(in srgb,var(--bc) 55%,var(--muted));border:2px dashed color-mix(in srgb,var(--bc) 35%,var(--line))}
.medal.got{--bd:var(--bc);border:0;color:#fff;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--bc) 55%,#fff),var(--bc) 70%);box-shadow:0 3px 0 color-mix(in srgb,var(--bc) 62%,#000),inset 0 0 0 3px rgba(255,255,255,.38)}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.badge.got{border-color:color-mix(in srgb,var(--sun) 55%,var(--line));background:linear-gradient(180deg,var(--sun-soft),var(--surface) 70%)}
.badge b{font-size:13px;line-height:1.3}
.badge small{font-size:11px;color:var(--muted);line-height:1.35}
.badge .bp{font-size:11px;font-weight:700;color:var(--warn);background:var(--surface);border:1px solid color-mix(in srgb,var(--sun) 60%,var(--line));border-radius:99px;padding:1px 8px}
.bprog{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:2px}
.bprog .track{width:80%;height:6px}
.bprog small{font-variant-numeric:tabular-nums}
.plus{flex:none;margin-left:auto;font-family:var(--display);font-size:16px;color:var(--warn);white-space:nowrap}
.nextb{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.nextb > span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nextb b{font-size:14px}
.nextb small{font-size:12px}
.nextb .track{height:7px}
/* 첫 화면: 한 줄 소개, 손님 링크, ? 버튼 */
.lead{text-align:center;font-size:17px;line-height:1.5;color:var(--ink)}
.lead b{color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:6px;align-self:center}
.brand{position:relative}
.helpbtn{position:absolute;right:0;top:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--display);font-size:17px;line-height:1;display:grid;place-items:center;padding:0}
.helpbtn:hover{color:var(--accent);border-color:var(--accent)}
/* 홈 메뉴 아이콘 위 작은 숫자 */
.menu4 .mi{position:relative}
.mchip{position:absolute;top:-7px;right:-12px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-style:normal;font-size:11px;font-weight:700;line-height:20px;text-align:center;border:2px solid var(--surface);box-sizing:content-box}
/* 사용법 팝업 */
body.modal-open{overflow:hidden}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.mback{position:absolute;inset:0;background:rgba(14,22,38,.55)}
.mbox{position:relative;width:min(400px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:24px;padding:20px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.28);animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.mbox:focus{outline:none}
.mclose{position:absolute;right:8px;top:6px;width:38px;height:38px;border:0;border-radius:50%;background:none;font-size:28px;line-height:1;color:var(--muted);padding:0}
.mart{width:100%;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(180deg,var(--sky-1),var(--sky-2));border-radius:18px;padding:16px 10px}
.mdesc{font-size:15px;max-width:30ch}
.mdots{display:flex;gap:6px}
.mdots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:var(--line);transition:width .2s}
.mdots button[aria-current="step"]{width:22px;background:var(--accent)}
.mbox .row{width:100%}
.mbox .cta{font-size:19px;padding:13px}
.introPath{justify-content:center}
.introFact{font-size:14px}
.introFact b{color:var(--warn)}
.introMedals{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.introGrow{display:flex;flex-direction:column;align-items:center;gap:4px}
.introLv{font-family:var(--display);font-size:16px;color:var(--navy)}
/* 추천 화면: 왜 이 운동을 할까요? */
.whycard{display:grid;grid-template-columns:80px 1fr;gap:12px 14px;align-items:center}
.whycard .habit,.whycard .src{grid-column:1/-1}
.bodymap{width:80px;height:auto}
.bodymap .base{fill:color-mix(in srgb,var(--accent) 14%,var(--surface-2));stroke:color-mix(in srgb,var(--accent) 25%,var(--line));stroke-width:1.2}
.bodymap .hot{fill:#F2643D;stroke:#fff;stroke-width:1.2;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.habit{font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:10px;padding:6px 10px}
/* 랭킹 */
.mecard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.mecard b{display:block;font-size:16px}
.mecard small{font-size:13px;color:var(--muted)}
.mecard.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#7B61FF));border:0;color:#fff}
.mecard.on small{color:rgba(255,255,255,.88)}
.mecard .rk{font-family:var(--display);font-size:38px;line-height:1}
.mecard .rk small{font-size:16px;color:inherit;margin-left:2px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;padding-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.pod b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod small{font-size:12px;color:var(--muted)}
.pod .pp{font-family:var(--display);font-size:18px;color:var(--navy);font-variant-numeric:tabular-nums}
.pod .rkm{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;margin-bottom:4px;box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 0 0 3px rgba(255,255,255,.35)}
.pod.p1 .rkm{background:radial-gradient(circle at 35% 30%,#FFE58A,#E9A817 70%);width:50px;height:50px;font-size:24px}
.pod.p2 .rkm{background:radial-gradient(circle at 35% 30%,#F1F4F8,#A7B1BF 70%)}
.pod.p3 .rkm{background:radial-gradient(circle at 35% 30%,#F6C9A0,#C9783A 70%)}
.pod i{display:block;width:100%;border-radius:12px 12px 4px 4px;margin-top:6px;background:var(--surface-2)}
.pod.p1 i{height:74px;background:linear-gradient(180deg,var(--sun-soft),var(--surface-2))}
.pod.p2 i{height:52px}
.pod.p3 i{height:38px}
.pod.mine b{color:var(--accent)}
.pod.empty{opacity:.45}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rlist li{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px}
.rlist .rk{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.rlist .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .nm em{font-style:normal;font-size:11px;color:#fff;background:var(--accent);border-radius:99px;padding:1px 7px;margin-left:4px}
.rlist .lv{font-size:12px;color:var(--muted)}
.rlist .pp{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.rlist li.mine{border-color:var(--accent);background:var(--accent-soft)}
.goal h3{font-size:17px}

/* tree */
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tree > li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tree .q{font-weight:700;display:flex;align-items:center;gap:8px}
.tree ul{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tree ul li{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:14px}
.tree .pl{color:var(--muted);min-width:46px}
.tree .score{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tree .fix{font-size:11px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:99px;padding:0 7px}
.tree .hit{border-color:var(--accent)}
.tree li.hitrow .pl,.tree li.hitrow .ex{color:var(--accent);font-weight:700}
.rule{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border-radius:12px;padding:12px;overflow-x:auto;white-space:pre;line-height:1.7}

/* info */
.credit dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
.credit dt{color:var(--muted);font-size:13px}
.credit dd{margin:0;font-weight:500;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input,.field select{width:100%;color:inherit;font:inherit;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--surface-2);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:500}
.tags span.base{background:var(--teal-soft);color:var(--teal)}

/* town */
.notice{background:var(--teal-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.notice.warn{background:var(--accent-soft)}
.notice:empty{display:none}
.draft{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:500}
.townmap{display:flex;flex-direction:column;gap:12px}
#map{height:320px;border-radius:18px;border:1px solid var(--line);overflow:hidden;background:var(--surface-2);z-index:0}
.spotlist{display:flex;flex-direction:column;gap:10px}
.spot{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px;text-align:left}
.spot:hover{border-color:var(--teal)}
.spot.first{border-color:var(--accent)}
.spot b{display:block;font-size:16px}
.spot small{font-size:13px;color:var(--muted);display:block}
.spot .dist{font-family:var(--display);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pin{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:16px;border:2px solid #fff}
.first .pin{background:var(--accent)}
.me{width:20px;height:20px;border-radius:50%;background:#2B6FD6;border:4px solid #fff;box-shadow:0 0 0 2px #2B6FD6}
.leaflet-div-icon{background:transparent;border:0}
@media (min-width:900px){
  body.wide .townmap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
  body.wide #map{height:min(600px,calc(100vh - 300px));min-height:400px}
  body.wide .spotlist{max-height:min(600px,calc(100vh - 300px));overflow-y:auto}
}

/* book: 동작 도감 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.track.big{height:12px}
.track.big i{background:var(--sun)}
.dh{display:flex;align-items:center;gap:8px;font-size:18px}
.dh span{color:var(--teal);display:inline-flex}
.dex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dcard{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.dcard:hover{border-color:var(--teal)}
.dcard .pl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--teal)}
.dcard b{font-size:14px;line-height:1.3}
.dcard .by{font-size:11.5px;font-weight:700;color:var(--accent)}
.dcard small{font-size:11.5px;color:var(--muted);line-height:1.35;word-break:keep-all}
.dcard.locked{background:var(--surface-2);border-style:dashed}
.dcard.locked .pl,.dcard.locked .by{color:var(--muted)}
.dcard.locked b{color:var(--muted)}
.dcard .dimg{width:100%;aspect-ratio:1;object-fit:contain;background:var(--surface-2);border-radius:10px;margin-bottom:2px}
.dcard.locked .dimg{filter:grayscale(1);opacity:.45}

/* reward */
.pop{animation:pop .55s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.lvup{background:var(--accent);color:var(--accent-ink);font-family:var(--display);border-radius:99px;padding:6px 18px;font-size:19px}
.newbadge.card2{background:var(--teal-soft)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{border:0;background:none;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
@media (prefers-reduced-motion: reduce){.bob,.pop,.bodymap .hot,.mbox{animation:none}.track i,.mdots button{transition:none}}
</style>
</head>

/* 운동 한 번의 기록을 더해요. 서버(서버_앱스스크립트.gs)의 applyDelta와 같아야 해요. */
function applyDelta(s,d){
  s.ids=s.ids||[]; if(d.id&&s.ids.includes(d.id)) return false;
  s.xp+=d.xp||0; s.verified+=d.verN||0;
  if(d.worked){ s.count++; if(!s.history.includes(d.day)) s.history.push(d.day);
    if(!s.bodies.includes(d.b)) s.bodies.push(d.b); if(!s.places.includes(d.p)) s.places.push(d.p); if(d.long) s.long=true; }
  if(d.f){ const k=d.b+'|'+d.p, a=s.feel[k]||[0,0]; s.feel[k]=[a[0]+d.f,a[1]+1]; }
  if(d.day&&d.moveXp){ if(!s.dayXp||s.dayXp.day!==d.day) s.dayXp={day:d.day,xp:0}; s.dayXp.xp+=d.moveXp; }   /* 오늘 받은 운동 포인트 (하루 한도용) */
  if(d.badges&&d.badges.length){ s.badges=s.badges||[]; d.badges.forEach(k=>{ if(!s.badges.includes(k)) s.badges.push(k); }); }   /* 한 번 받은 배지는 계속 내 것 */
  s.last={b:d.b,p:d.p,t:d.t};
  if(d.id){ s.ids.push(d.id); if(s.ids.length>100) s.ids.shift(); }
  return true;
}
const withQueue=st=>{ const s=Object.assign(BLANK(),JSON.parse(JSON.stringify(st||{}))); Q.forEach(d=>applyDelta(s,d)); return s; };

const SRV={v:0};   /* 서버 버전: 2부터 배지 기록·하루 한도·랭킹을 지원해요 */
async function api(action,data){
  const ac=new AbortController(), tm=setTimeout(()=>ac.abort(),15000);
  try{ const r=await fetch(CONFIG.SERVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data)),signal:ac.signal});
    const j=await r.json(); if(j&&j.v) SRV.v=j.v; return j; }
  catch(e){ return {ok:false,error:'network'}; }
  finally{ clearTimeout(tm); }
}
const SYNC={busy:false,state:'saved'};   /* saved | offline | auth */
async function flush(){
  const u=DEV.user; if(!u||u.kind!=='server'||SYNC.busy||!Q.length) return;
  SYNC.busy=true;
  while(Q.length&&DEV.user===u){
    const r=await api('add',{name:u.name,token:u.token,delta:Q[0]});
    if(DEV.user!==u) break;
    if(!r.ok){ SYNC.state=r.error==='auth'?'auth':'offline'; break; }
    Q.shift(); S=withQueue(r.state); save(); SYNC.state='saved'; RANK.at={};   /* 새 기록이 들어갔으니 랭킹을 다시 불러와요 */
  }
  SYNC.busy=false; if(DEV.user===u){ renderStatus(); if(UI.tab==='rank'&&!UI.gate) loadRank(true); }
}
async function refresh(){   /* 다른 기기에서 운동한 기록까지 불러오기 */
  const u=DEV.user; if(!u||u.kind!=='server') return;
  const r=await api('load',{name:u.name,token:u.token});
  if(DEV.user!==u) return;
  if(r.ok){ S=withQueue(r.state); save(); SYNC.state=Q.length?SYNC.state:'saved'; if(UI.running) renderStatus(); else render(); flush(); }   /* 운동 중에는 화면(영상·카메라)을 다시 그리지 않아요 */
  else if(r.error==='auth'){ SYNC.state='auth'; renderStatus(); }
}
window.addEventListener('online',flush);
setInterval(()=>{ if(Q.length) flush(); },60000);

const pinHash=(k,p)=>{ let h=2166136261; for(const c of k+':'+p){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return (h>>>0).toString(16); };
function localAuth(action,f){
  const name=cleanName(f.name), k=ukey(name), all=store.get(KEY+':local',{});
  if(!name) return {ok:false,error:'name'};
  if(action==='register'){
    if(f.pin&&!/^\d{4}$/.test(f.pin)) return {ok:false,error:'pin_format'};
    if(all[k]) return {ok:false,error:'exists'};
    all[k]={name,group:cleanName(f.group),pin:f.pin?pinHash(k,f.pin):''}; store.set(KEY+':local',all);
    return {ok:true,user:{name,group:all[k].group,hasPin:!!f.pin}};
  }
  const u=all[k]; if(!u) return {ok:false,error:'notfound'};
  if(u.pin&&!f.pin) return {ok:false,error:'pin_need'};
  if(u.pin&&pinHash(k,f.pin)!==u.pin) return {ok:false,error:'pin'};
  return {ok:true,user:{name:u.name,group:u.group,hasPin:!!u.pin}};
}

/* ---------- 배우기: 영상과 타이머 함께 가기 ----------
   우리 반 영상 파일(mp4): 영상의 재생 시간이 곧 타이머라서 영상 속 동작·남은 초와 앱이 늘 같아요.
     영상을 누르거나 "잠깐 멈춤"을 누르면 둘 다 멈추고, 건너뛰기를 누르면 영상도 다음 동작으로 가요.
     새 세트가 시작되면 영상을 처음부터 다시 틀어요. 영상을 못 불러오면 타이머만 가요.
   유튜브: 영상이 재생 중일 때만 타이머가 흘러요. 영상이 멈추면 타이머도 멈추고, 새 세트가 시작되면 처음부터 다시 틀어요.
     영상이 먼저 끝나면 남은 동작은 타이머만으로 해요. 유튜브를 못 불러오면 예전처럼 타이머만 가요. */
const VS={on:false,playing:false,ended:false,player:null,file:null,err:'',slow:false,slowT:0};
let ytLoad=null;
function loadYT(){
  if(window.YT&&YT.Player) return Promise.resolve();
  if(!ytLoad) ytLoad=new Promise((res,rej)=>{
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{ if(prev) prev(); res(); };
    const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.onerror=()=>rej(new Error('yt')); document.head.appendChild(s);
    setTimeout(()=>rej(new Error('timeout')),8000);
  }).catch(e=>{ ytLoad=null; throw e; });
  return ytLoad;
}
function vsStart(){
  Object.assign(VS,{on:false,playing:false,ended:false,player:null,file:null,err:'',slow:false});
  const fv=document.getElementById('vfile'); if(fv) return vsFile(fv);
  if(!document.getElementById('vframe')) return;
  VS.on=true; vsNote();
  loadYT().then(()=>{
    if(!UI.running||!VS.on||!document.getElementById('vframe')) return;
    VS.player=new YT.Player('vframe',{events:{
      onReady:e=>{ try{ if(!UI.paused) e.target.playVideo(); }catch(_){} },
      onStateChange:e=>{
        VS.playing=e.data===YT.PlayerState.PLAYING;
        if(VS.playing){ VS.ended=false; if(UI.paused) setPaused(false); }
        if(e.data===YT.PlayerState.ENDED) VS.ended=true;
        vsNote(); },
      onError:()=>vsOff()
    }});
  }).catch(()=>vsOff());
}
/* 우리 반 영상 파일: <video>를 유튜브 플레이어와 같은 모양(playVideo · pauseVideo · seekTo)으로 감싸요 */
const VERR='영상을 불러오지 못했어요. 타이머로 진행해요.';
function vsFile(v){
  const mine=()=>VS.file===v;
  Object.assign(VS,{on:true,file:v,player:{
    playVideo(){ const p=v.play(); if(p&&p.catch) p.catch(()=>{ if(mine()) vsNote(); }); },
    pauseVideo(){ v.pause(); }, stopVideo(){ v.pause(); },
    seekTo(s){ try{ v.currentTime=s; }catch(_){} }}});
  v.muted=true;
  v.addEventListener('play',()=>{ if(!mine()) return; if(VS.on&&UI.paused) setPaused(false); vsNote(); });
  v.addEventListener('playing',()=>{ if(!mine()) return; VS.playing=true; VS.ended=false; vsNote(); });
  v.addEventListener('pause',()=>{ if(!mine()) return; VS.playing=false; vsNote(); });
  v.addEventListener('waiting',()=>{ if(!mine()) return; VS.playing=false; vsNote(); });
  v.addEventListener('ended',()=>{ if(!mine()||v.currentTime<(v.duration||0)-.5) return; VS.playing=false; VS.ended=true; vsNote(); });
  v.addEventListener('error',()=>{ if(!mine()) return; VS.err=VERR; vsOff(); });
  if(v.error){ VS.err=VERR; return vsOff(); }
  if(!UI.paused) VS.player.playVideo();
  vsNote();
}
function vsOff(){ VS.on=false; if(VS.file){ try{ VS.file.pause(); }catch(_){} } vsNote(); }
function vsStop(){ try{ VS.player&&VS.player.stopVideo(); }catch(_){} clearTimeout(VS.slowT); Object.assign(VS,{on:false,playing:false,ended:false,player:null,file:null,err:'',slow:false}); }
function vsCall(fn){ if(VS.file&&!VS.on) return; try{ VS.player&&VS.player[fn](); }catch(_){} }
function vsNewSet(){ if(!VS.on||!VS.player) return; VS.ended=false; VS.playing=false; try{ VS.player.seekTo(0,true); VS.player.playVideo(); }catch(_){} vsNote(); }
const vsWait=()=>VS.on&&!VS.playing&&!VS.ended;   /* 영상을 기다리는 중이면 타이머를 멈춰요 */
/* 우리 반 영상 파일이 켜져 있으면 영상의 재생 시간이 곧 타이머예요 (도전 모드는 카메라라서 빼요) */
const vsClock=()=>VS.on&&VS.file&&!VS.ended&&UI.mode!=='challenge'?VS.file.currentTime:null;
function vsAlign(){   /* 건너뛰기로 동작이 바뀌면 영상도 그 동작의 시작으로 가요 (영상이 뒤처졌을 때만) */
  const c=vsClock(), cur=UI.list[UI.idx]; if(c==null||!cur) return;
  if(c<cur.off-.3) VS.player.seekTo(cur.off);
}
function vsTap(){   /* 영상을 누르면 영상과 타이머가 같이 멈추거나 같이 가요 */
  const f=VS.file; if(!f) return;
  if(!VS.on){ if(!VS.err){ if(f.paused){ const p=f.play(); if(p&&p.catch) p.catch(()=>{}); } else f.pause(); } return; }
  if(f.paused){ setPaused(false); VS.player.playVideo(); } else { setPaused(true); VS.player.pauseVideo(); }
}
function vsFull(){
  const f=VS.file, w=f&&f.parentNode; if(!w) return;
  if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen().catch(()=>{}); return; }

/* 다른 탭으로 가면 영상도 멈췄다가, 돌아오면 이어서 틀어요 (타이머와 같아요) */
document.addEventListener('visibilitychange',()=>{

const FREE='<br><button class="ghost" data-act="vfree" style="margin-top:8px;padding:6px 12px;font-size:13px">영상 없이 타이머만 하기</button>';
function vsNote(){
  const f=VS.file, n=document.getElementById('vnote');
  if(f){
    const w=f.parentNode; if(w){ w.classList.toggle('on',!f.paused); w.classList.toggle('err',!!VS.err); }
    const loading=VS.on&&!VS.playing&&!VS.ended&&!UI.paused&&!f.paused;   /* 오래 걸리면 "타이머만" 버튼을 보여 줘요 */
    clearTimeout(VS.slowT); if(!loading) VS.slow=false;
    VS.slowT=loading&&!VS.slow?setTimeout(()=>{ VS.slow=true; vsNote(); },4000):0;
    if(!n) return;
    n.innerHTML = VS.err ? VS.err
      : !VS.on ? '영상 없이 타이머로 하고 있어요.'
      : VS.playing ? '영상과 타이머가 함께 가요.'
      : VS.ended ? '영상이 끝났어요. 남은 동작은 타이머로 해요.'
      : UI.paused ? '잠깐 멈췄어요. 영상이나 "계속하기"를 누르면 이어서 해요.'
      : f.paused ? '▶를 누르면 영상과 타이머가 함께 시작해요.'+FREE
      : '영상을 불러오는 중이에요.'+(VS.slow?FREE:'');
    return;
  }
  if(!n) return;
  n.innerHTML = !VS.on ? ''
    : VS.playing ? '영상과 타이머가 함께 가요.'
    : VS.ended ? '영상이 끝났어요. 남은 동작은 타이머로 해요.'
    : '타이머는 영상이 재생될 때만 흘러가요. 영상이 멈춰 있으면 ▶를 눌러 주세요.'+FREE;
}

const koVoices=()=>('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ko')):[];

const calm=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function fanfare(big){
  if(!DEV.voice) return; initAudio(); if(!V.ctx) return;
  try{ (big?[523,659,784,1047,784,1047]:[523,659,784,1047]).forEach((fq,i)=>{
    const t=V.ctx.currentTime+i*.11, o=V.ctx.createOscillator(), g=V.ctx.createGain(); o.type='triangle'; o.frequency.value=fq;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(g).connect(V.ctx.destination); o.start(t); o.stop(t+.32); }); }catch(e){}
}
function confetti(big){
  if(calm()) return;
  const old=document.getElementById('fx'); if(old) old.remove();
  const cv=document.createElement('canvas'); cv.id='fx'; cv.setAttribute('aria-hidden','true'); document.body.appendChild(cv);
  const w=cv.width=innerWidth, h=cv.height=innerHeight, c=cv.getContext('2d'), cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--teal','--sun'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:big?150:70},()=>({x:w/2,y:h*.3,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+5,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*3)]}));
  const t0=performance.now(), life=2400;
  (function f(t){ const age=t-t0; c.clearRect(0,0,w,h); c.globalAlpha=Math.max(0,1-age/life);
    ps.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; c.save(); c.translate(p.x,p.y); c.rotate(p.a); c.fillStyle=p.c; c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); c.restore(); });
    if(age<life&&cv.isConnected) requestAnimationFrame(f); else cv.remove(); })(t0);
}
function countUp(el,to){
  if(!el) return; if(calm()||!to){ el.textContent=`+${to}P`; return; }
  const t0=performance.now();
  (function f(t){ const k=Math.min(1,(t-t0)/900); el.textContent=`+${Math.round(to*(1-Math.pow(1-k,3)))}P`; if(k<1) requestAnimationFrame(f); })(t0);
}

/* ---------- 자세 인식 (티처블 머신) ---------- */
/* 자세 도우미: 티처블 머신이 헷갈려 하는 동작을 몸의 관절 점(PoseNet)으로 한 번 더 확인해요.
   true = 자세 맞음, false = 아님, null = 필요한 관절이 화면에 안 보임 */
const POSE_HELP = (() => {
  const MIN = 0.25;
  const P = (kp, n) => { const k = kp && kp.find(x => x.part === n); return k && k.score >= MIN ? k.position : null; };
  const sub = (a, b) => ({x: a.x - b.x, y: a.y - b.y});
  const len = v => Math.hypot(v.x, v.y);
  const deg = r => r * 180 / Math.PI;
  const clamp1 = v => Math.max(-1, Math.min(1, v));
  const fromDown = v => deg(Math.acos(clamp1(v.y / (len(v) || 1))));          /* 0 = 아래, 90 = 옆, 180 = 위 */
  const between = (a, b) => deg(Math.acos(clamp1((a.x * b.x + a.y * b.y) / ((len(a) * len(b)) || 1))));
  function arms(kp){
    const s = [P(kp, 'leftShoulder'), P(kp, 'rightShoulder')];
    if(!s[0] || !s[1]) return null;
    return {s, e: [P(kp, 'leftElbow'), P(kp, 'rightElbow')], w: [P(kp, 'leftWrist'), P(kp, 'rightWrist')],
      mid: {x: (s[0].x + s[1].x) / 2, y: (s[0].y + s[1].y) / 2}, sw: len(sub(s[0], s[1]))};
  }
  const RULES = {
    /* W 날개: 위팔은 옆으로 내려가고(팔꿈치가 어깨보다 바깥), 아래팔은 위로 */
    '날개뼈 모으기': kp => { const A = arms(kp); if(!A) return null; let ok = 0;
      for(const i of [0, 1]){ const S = A.s[i], E = A.e[i], W = A.w[i]; if(!E || !W) return null;
        const ua = sub(E, S), fa = sub(W, E), side = Math.sign(S.x - A.mid.x) || 1, eUA = fromDown(ua);
        if(eUA >= 15 && eUA <= 110 && (E.x - A.mid.x) * side >= Math.abs(S.x - A.mid.x) * 0.7 && fa.y < 0 && 180 - fromDown(fa) <= 55) ok++; }
      return ok === 2; },
    /* 팔 벌리기(가슴 활짝·승리 포즈): 두 팔을 옆이나 V로 쭉 펴서 바깥으로 */
    '팔 벌리기': kp => { const A = arms(kp); if(!A) return null; let ok = 0;
      for(const i of [0, 1]){ const S = A.s[i], E = A.e[i], W = A.w[i]; if(!E || !W) return null;
        const ua = sub(E, S), fa = sub(W, E), side = Math.sign(S.x - A.mid.x) || 1, eUA = fromDown(ua);
        if(eUA >= 60 && eUA <= 170 && between(ua, fa) <= 55 && (W.x - A.mid.x) * side >= A.sw * 1.1) ok++; }
      return ok === 2; },
    /* 한 발 균형: 한쪽 무릎이 다른 무릎보다 확실히 위 (앞으로 들면 허벅지가 짧아 보여요) */
    '무릎 들기': kp => { const h = [P(kp, 'leftHip'), P(kp, 'rightHip')], k = [P(kp, 'leftKnee'), P(kp, 'rightKnee')];
      if(!h[0] || !h[1] || !k[0] || !k[1]) return null;
      const r = k[0].y < k[1].y ? 0 : 1, o = 1 - r, Lr = len(sub(k[r], h[r])), Lo = len(sub(k[o], h[o]));
      if(Lo < 1) return null;
      const A = arms(kp);   /* 서 있는 다리의 허벅지가 몸통에 비해 너무 짧아 보이면(쪼그려 앉음) 아님 */
      if(A && Lo < 0.45 * len(sub(A.mid, {x: (h[0].x + h[1].x) / 2, y: (h[0].y + h[1].y) / 2}))) return false;
      const lift = (k[o].y - k[r].y) / Lo;
      return fromDown(sub(k[o], h[o])) <= 35 && (lift >= 0.45 || (Lr / Lo <= 0.6 && lift >= 0.25)); },
    /* 초승달: 한 팔은 머리 위로, 몸(어깨 선)은 반대쪽으로 기울어요. 두 팔 다 위면 아님 */
    '옆구리 늘리기': kp => { const A = arms(kp), nose = P(kp, 'nose') || P(kp, 'leftEye') || P(kp, 'rightEye'); if(!A || !nose) return null;
      const hL = P(kp, 'leftHip'), hR = P(kp, 'rightHip'); let seen = false;
      for(const i of [0, 1]){ const S = A.s[i], O = A.s[1 - i], E = A.e[i], W = A.w[i]; if(!E || !W) continue; seen = true;
        if(W.y >= nose.y || fromDown(sub(E, S)) < 110) continue;
        const Wo = A.w[1 - i]; if(Wo && Wo.y < nose.y) continue;
        const dir = Math.sign(O.x - S.x) || 1, tilt = deg(Math.atan2(O.y - S.y, Math.abs(O.x - S.x)));
        let lean = 0;
        if(hL && hR){ const v = sub(A.mid, {x: (hL.x + hR.x) / 2, y: (hL.y + hR.y) / 2}); lean = deg(Math.atan2(v.x * dir, -v.y)); }
        if(tilt >= 8 || lean >= 8) return true; }
      return seen ? false : null; }
  };
  /* 화면에 꼭 보여야 하는 관절과 안 보일 때 안내 */
  const NEED = {'무릎 들기': '무릎까지 보이게 한두 걸음 뒤로 가요', '날개뼈 모으기': '두 팔이 다 보이게 조금 뒤로 가요',
    '팔 벌리기': '두 팔이 다 보이게 조금 뒤로 가요', '옆구리 늘리기': '머리와 두 팔이 다 보이게 조금 뒤로 가요'};
  function check(cls, pose){ const f = RULES[cls]; if(!f || !pose || !pose.keypoints) return null;
    try{ return f(pose.keypoints); }catch(e){ return null; } }
  return {check, has: cls => !!RULES[cls], need: cls => NEED[cls] || ''};
})();
/* 자세 도우미를 AI 예측에 더하기: 관절로 맞으면 그 동작 확률을 95%로 올리고, 필요한 관절이 2초 넘게 안 보이면 안내해요 */
function helpPose(cur,pose,preds){
  UI.help=false;
  if(!CONFIG.POSE_HELP||!POSE_HELP.has(cur.pose)||!preds) return;
  const r=POSE_HELP.check(cur.pose,pose), now=performance.now();
  if(r===null){ if(!UI.unseen) UI.unseen=now; } else UI.unseen=0;
  if(r===true){ const tp=preds.find(x=>x.className===cur.pose); if(tp&&tp.probability<.95){ tp.probability=.95; UI.help=true; } }
}
const poseHint=cur=>CONFIG.POSE_HELP&&UI.unseen&&performance.now()-UI.unseen>2000?POSE_HELP.need(cur.pose):'';
const P={model:null,url:'',classes:[],webcam:null,loaded:new Set()};
const SIZE=400;
function loadScript(src){ if(P.loaded.has(src)) return Promise.resolve();

/* ---------- 랭킹: 서버(서버_앱스스크립트.gs의 rank)가 순위를 계산해요. 이름은 서버에서 가운데 글자를 ○로 가려서 보내요 ---------- */
const RANK={period:'week',data:{},at:{},busy:{},err:''};
async function loadRank(force,period){
  const p=period||RANK.period;
  if(!CONFIG.SERVER_URL||RANK.busy[p]) return;
  if(!force&&(RANK.err||(RANK.data[p]&&Date.now()-(RANK.at[p]||0)<60000))) return;
  RANK.busy[p]=true; if(force) RANK.err='';
  const u=DEV.user, me=u&&u.kind==='server'?{name:u.name,token:u.token}:{};
  const r=await api('rank',Object.assign({period:p},me));
  RANK.busy[p]=false;
  if(DEV.user!==u) return;
  if(r.ok){ RANK.data[p]=r; RANK.at[p]=Date.now(); RANK.err=''; }
  else RANK.err=r.error==='action'?'old':(r.error||'server');
  if(UI.gate||UI.running) return;
  if(UI.tab==='rank') render();
  else if(UI.tab==='today'&&UI.screen==='home'){ const c=document.getElementById('rankChip'), t=rankChipText(); if(c){ c.textContent=t; c.hidden=!t; } }
}
function rankChipText(){
  const r=RANK.data.week; return r&&r.me&&r.me.rank?`${r.me.rank}위`:'';
}
function viewRank(){
  const p=RANK.period, r=RANK.data[p], u=DEV.user;
  const seg=`<div class="seg" role="group" aria-label="랭킹 기간"><button data-act="rankp" data-k="week" aria-pressed="${p==='week'}">이번 주</button><button data-act="rankp" data-k="all" aria-pressed="${p==='all'}">전체</button></div>`;
  let body='';
  if(!CONFIG.SERVER_URL) body='<div class="card"><p>랭킹은 기록 서버를 연결하면 볼 수 있어요.</p></div>';
  else if(!r&&RANK.err) body=`<div class="card"><p>${RANK.err==='old'?'랭킹을 준비하고 있어요. 곧 열려요!':'랭킹을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}</p><button class="ghost" data-act="rankRetry">다시 불러오기</button></div>`;
  else if(!r) body='<div class="card"><p class="muted">랭킹을 불러오는 중이에요...</p></div>';
  else{
    const top=r.top||[];
    const pod=[top[1],top[0],top[2]].map((x,i)=>{ const n=[2,1,3][i];
      return x?`<div class="pod p${n}${x.me?' mine':''}"><span class="rkm">${x.rank}</span><b>${esc(x.name)}</b><small>Lv.${x.lv}</small><span class="pp">${x.pts}P</span><i></i></div>`:`<div class="pod p${n} empty"><span class="rkm">${n}</span><b>?</b><small>도전!</small><span class="pp">&nbsp;</span><i></i></div>`; }).join('');
    const rest=top.slice(3).map(x=>`<li class="${x.me?'mine':''}"><span class="rk">${x.rank}</span><span class="nm">${esc(x.name)}${x.me?' <em>나</em>':''}</span><span class="lv">Lv.${x.lv}</span><span class="pp">${x.pts}P</span></li>`).join('');
    const m=r.me;
    const meCard=!u||u.kind!=='server'?'<div class="mecard"><b>이름을 등록하면 나도 랭킹에 올라가요!</b><small>손님 모드는 기록이 남지 않아요.</small></div>'
      :!m||!m.rank?`<div class="mecard"><b>${p==='week'?'이번 주':'아직'} 포인트가 없어요</b><small>운동하고 랭킹에 이름을 올려 봐요!</small></div>`
      :`<div class="mecard on"><span class="rk">${m.rank}<small>위</small></span><span><b>나 · ${m.pts}P</b><small>${m.up?`${m.up.gap}P 더 모으면 ${m.up.rank}위!`:'1위예요! 매일 조금씩 지켜 봐요.'}</small></span></div>`;
    const G=CONFIG.CLASS_GOAL, c=r.count||0, lap=Math.floor(c/G), goal=(lap+1)*G;
    body=`${meCard}
     ${top.length?`<div class="podium">${pod}</div>${rest?`<ol class="rlist">${rest}</ol>`:''}`
       :`<div class="card"><p>${p==='week'?'이번 주':'아직'} 랭킹에 오른 사람이 없어요. 첫 번째 주인공이 되어 보세요!</p></div>`}
     <div class="card goal"><div class="topline"><h3>우리 모두 함께 ${goal}번 운동하기</h3><span class="muted" style="font-size:13px">${lap?`목표 ${lap}번 달성!`:''}</span></div>
      <div class="track big"><i style="width:${Math.min(100,(c-lap*G)/G*100)}%"></i></div>
      <p class="note">지금까지 ${c}번 · 참여 ${r.users||0}명. 혼자가 아니라 다 함께 채우는 목표예요.</p></div>
     <p class="note">포인트 = 운동 포인트(하루 최대 ${CONFIG.DAILY_MAX}P) + 배지 보너스. ${p==='week'?`이번 주 랭킹은 월요일(${esc(r.since||'')})부터 새로 시작해요. `:''}${r.masked===false?'':'이름은 가운데 글자를 ○로 가려요.'}</p>`;
  }
  $view.innerHTML=`<div class="col">
   <div><p class="eyebrow">랭킹</p><h2>${p==='week'?'이번 주':'전체'} 튼튼 랭킹</h2></div>
   ${seg}${body}</div>`;
  loadRank(false);
}

/* ---------- 우리 동네: 위치는 이 기기에서 거리 계산에만 쓰고 저장·전송하지 않아요 ---------- */
const FAR_M=5000, ROUGH_M=300, WALK_M_PER_MIN=67;
const TW={map:null,me:null,note:'',warn:false,busy:false,err:''};
function meters(a,b){
  const rad=d=>d*Math.PI/180, dLat=rad(b[0]-a[0]), dLng=rad(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(h));
}
const distText=m=>m<1000?`${Math.round(m/10)*10}m`:`${(m/1000).toFixed(1)}km`;
const walkText=m=>`걸어서 약 ${Math.max(1,Math.round(m/WALK_M_PER_MIN))}분`;
const spotsSorted=()=>SPOTS.map((s,i)=>({...s,i,m:TW.me?meters(TW.me,[s.lat,s.lng]):null})).sort((a,b)=>TW.me?a.m-b.m:0);

}
async function mountMap(){

  catch(e){ const n=document.getElementById('townNote'); if(n){ n.textContent='지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요. 장소 목록은 아래에서 볼 수 있어요.'; n.classList.add('warn'); } return; }
  if(!el.isConnected) return;
  if(TW.map){ TW.map.remove(); TW.map=null; }
  const m=TW.map=L.map(el).setView(TOWN_CENTER,15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);
  m.on('click',e=>{ TW.me=[e.latlng.lat,e.latlng.lng]; TW.note='지도에서 고른 곳에서 가까운 순서예요. 다른 곳을 누르면 다시 찾아요.'; TW.warn=false; render(); });
  spotsSorted().forEach((s,n)=>{ const first=TW.me&&n===0;
    L.marker([s.lat,s.lng],{title:s.name,icon:L.divIcon({className:first?'first':'',html:`<div class="pin">${n+1}</div>`,iconSize:[30,30]})}).addTo(m).on('click',()=>openSpot(s.i)); });
  if(TW.me) L.marker(TW.me,{title:'내 위치',icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[20,20]})}).addTo(m);
  const pts=SPOTS.map(s=>[s.lat,s.lng]); if(TW.me) pts.push(TW.me);
  /* 화면 크기가 정해진 뒤에 맞춰야 장소가 모두 들어와요 */
  setTimeout(()=>{ if(TW.map!==m) return; m.invalidateSize(); m.fitBounds(L.latLngBounds(pts).pad(TW.me?.15:.25),{animate:false}); },50);

  2:'지금은 위치를 찾지 못했어요. 지도에서 직접 골라 주세요.',

function useGps(){

  if(cur.sets>1&&(!prev||prev.set!==cur.set)) t+=`${cur.set}세트. `;
  t+=`${cur.title}. ${cur.cue}`;

}
async function loop(t){
  if(!UI.running) return;
  const dt=Math.min((t-UI.last)/1000,.25); UI.last=t;   /* 다른 탭에 다녀와도 시간이 한꺼번에 흐르지 않게 */
  const cur=UI.list[UI.idx]; let preds=null, ok=!UI.paused&&!document.hidden;
  if(UI.mode!=='challenge'&&vsWait()) ok=false;
  if(UI.mode==='challenge'){
    if(UI.demo){ drawDemo(cur); if(cur.pose) preds=[{className:CONFIG.BASE_CLASS,probability:UI.holding?.05:.92},{className:cur.pose,probability:UI.holding?.94:.04}]; }
    else if(P.webcam){
      P.webcam.update();
      if(cur.pose){ const {pose,posenetOutput}=await P.model.estimatePose(P.webcam.canvas); preds=await P.model.predict(posenetOutput); drawCam(pose); helpPose(cur,pose,preds); }
      else drawCam(null);
    }
    if(!UI.running) return;
    if(cur.pose){
      const tp=preds.find(x=>x.className===cur.pose);
      UI.hist.push(tp?tp.probability:0); if(UI.hist.length>6) UI.hist.shift();
      const avg=UI.hist.reduce((a,b)=>a+b,0)/UI.hist.length;   /* 깜빡임 방지용 평균 */
      const matched=avg>=CONFIG.THRESHOLD;
      if(matched&&!UI.okPrev){ beep(); if(!UI.matchedOnce) say('좋아요, 그대로 유지해요!'); UI.matchedOnce=true; }
      if(!matched&&UI.okPrev&&!UI.paused&&performance.now()-UI.lastWarn>5000){ say('자세를 다시 잡아 볼까요?',true); UI.lastWarn=performance.now(); }
      UI.okPrev=matched; ok=ok&&matched;
    }
  }
  const clock=vsClock();   /* 우리 반 영상이면 영상의 시간이 곧 타이머 */
  if(clock!=null) UI.held=Math.min(cur.sec,Math.max(0,clock-cur.off));
  else if(ok) UI.held+=dt;
  const left=Math.max(0,cur.sec-UI.held);
  if(left<=5&&!UI.spoke5&&cur.sec>8&&ok){ say('5초 남았어요'); UI.spoke5=true; }
  updateTick(cur,left,ok,preds);
  if(UI.held>=cur.sec){ UI.results[UI.idx]=cur.pose?(UI.demo?'done':'verified'):'done'; return advance(); }
  requestAnimationFrame(loop);
}
function advance(){
  UI.idx++; Object.assign(UI,{held:0,hist:[],okPrev:false,matchedOnce:false,spoke5:false,unseen:0,help:false});
  if(UI.idx>=UI.list.length) return finishPlay();
  if(UI.list[UI.idx].set!==UI.list[UI.idx-1].set) vsNewSet();   /* 새 세트: 영상도 처음부터 */
  else vsAlign();   /* 건너뛰었으면 영상도 다음 동작으로 */
  updateStepDom(); announce(false);
  if(UI.running){ UI.last=performance.now(); requestAnimationFrame(loop); }
}
function updateTick(cur,left,ok,preds){
  const C=2*Math.PI*78, prog=document.getElementById('prog'); if(!prog) return;
  prog.style.strokeDashoffset=C*(1-left/cur.sec);
  document.getElementById('num').textContent=Math.ceil(left);
  const pill=document.getElementById('pill');
  if(pill){ pill.textContent=UI.paused?'멈춤':cur.pose?(ok?'자세 인정! 유지하세요':(UI.mode==='challenge'&&!UI.demo&&poseHint(cur))||'자세를 맞춰 주세요'):'타이머 진행 중'; pill.classList.toggle('ok',ok); }
  if(preds){ const th=CONFIG.THRESHOLD*100;
    document.getElementById('conf').innerHTML='<p class="note">AI가 보는 내 자세 · 세로선이 인정 기준</p>'+preds.map(p=>{
      const isT=p.className===cur.pose, v=Math.round(p.probability*100);
      return `<div class="bar ${isT?'target':''} ${isT&&ok?'ok':''}"><span title="${esc(p.className)}">${esc(p.className)}</span><span class="t"><i style="width:${v}%"></i>${isT?`<span class="th" style="left:${th}%"></span>`:''}</span><em>${v}%</em></div>`;}).join(''); }
}
function drawCam(pose){
  if(!UI.ctx||!P.webcam) return;

function drawDemo(cur){
  const c=UI.ctx; if(!c) return; const cs=getComputedStyle(document.documentElement);
  c.clearRect(0,0,SIZE,SIZE);
  const on=cur.pose?UI.holding:!UI.paused;
  c.strokeStyle=(on?cs.getPropertyValue('--teal'):cs.getPropertyValue('--muted')).trim(); c.lineWidth=7; c.lineCap='round';
  const tilt=on&&cur.pose?.35:0;
  c.beginPath(); c.arc(200+Math.sin(tilt)*70,120+(1-Math.cos(tilt))*70,30,0,Math.PI*2); c.stroke();
  const armY=on&&cur.pose?150:260;
  c.beginPath(); c.moveTo(200,190); c.lineTo(200,290); c.moveTo(200,210); c.lineTo(140,armY); c.moveTo(200,210); c.lineTo(260,armY);
  c.moveTo(200,290); c.lineTo(160,360); c.moveTo(200,290); c.lineTo(240,360); c.stroke();
}

    <dt>동작 연구</dt><dd>1모둠 · 2모둠 · 3모둠 · 4모둠 · 5모둠 · 6모둠 <span class="muted">(수업 후 이름 채우기)</span></dd>
    <dt>자세 모델</dt><dd>우리 반이 티처블 머신으로 학습</dd>
    <dt>시범 영상</dt><dd>모둠이 고른 동작을 튼튼이 영상으로 (Claude로 제작)</dd>
    <dt>튼튼이 그림</dt><dd>레벨업·배지·도감 아이디어 1~4모둠 디자이너 · 그림 정리 Claude</dd>
    <dt>사용한 도구</dt><dd>구글 설문 · 스프레드시트 · 제미나이 · 티처블 머신 · 앱스 스크립트</dd>
   </dl></div>
   <div class="card"><h3>안전하게 운동해요</h3>
    <p class="muted">아프거나 어지러우면 바로 멈추고 선생님이나 보호자에게 말해요. 카메라 인증을 할 때는 주변에 부딪힐 물건이 없는지 먼저 확인해요.</p></div>
   <div class="card">
    <h3>지금 사용하는 사람</h3>
    <p><b>${u.kind==='guest'?'손님':fullName(u)}</b>${u.hasPin?' <span class="muted">· 비밀번호 있음</span>':''}</p>
    <p class="note">${u.kind==='server'?(SYNC.state==='auth'?'이 기기의 로그인이 끝났어요. 나갔다가 다시 들어오면 기다리던 기록도 저장돼요.':Q.length?`인터넷이 연결되면 기록 ${Q.length}개를 저장해요.`:'모든 기록이 저장됐어요. 다른 기기에서도 이 이름으로 이어서 할 수 있어요.'):u.kind==='guest'?'손님 모드는 기록이 남지 않아요.':'기록이 이 기기에만 저장돼요.'}</p>
    <button class="ghost" data-act="logout">나가기 (다른 사람으로 바꾸기)</button>
    <p class="note">함께 쓰는 컴퓨터에서는 운동이 끝나면 꼭 나가기를 눌러 주세요.</p>
   </div>
   ${CONFIG.MODEL_URL?'':`<div class="card">
    <h3>설정</h3>
    <div class="field"><label for="modelInput">티처블 머신 모델 링크 (선생님용)</label><input type="url" id="modelInput" placeholder="https://teachablemachine.withgoogle.com/models/..." value="${esc(DEV.modelUrl)}">
     <p class="note">${linked?'연결됨. 도전 모드에서 카메라 인증을 사용해요.':'연결 안 됨. 도전 모드는 체험 모드로 실행돼요.'} 모든 기기에 적용하려면 파일의 CONFIG.MODEL_URL에 넣어 주세요.</p></div>
    <button class="ghost" data-act="saveInfo" id="saveBtn">저장</button>
   </div>`}
   <div class="card"><h3>음성 안내 목소리</h3>
    ${vs.length?`<div class="field"><label for="voiceSel">이 기기의 한국어 목소리</label><select id="voiceSel">${vs.map(v=>`<option value="${esc(v.name)}"${V.voice&&V.voice.name===v.name?' selected':''}>${esc(v.name)}${best&&v.name===best.name?' (추천)':''}${v.localService?'':' · 인터넷 필요'}</option>`).join('')}</select></div>
    <button class="ghost" data-act="voiceTest">들어 보기</button>
    <p class="note">목소리는 기기와 브라우저마다 달라요. 컴퓨터에서는 엣지의 "SunHi (Natural)", 크롬의 "Google 한국의"가 가장 자연스러워요. 고른 목소리는 이 기기에 저장돼요.</p>`
    :'<p class="note">이 기기에서는 아직 한국어 목소리를 찾지 못했어요.</p>'}
   </div>
   <div class="card"><h3>티처블 머신 클래스 이름</h3>
    <p class="muted" style="font-size:14px">모델을 만들 때 아래 이름과 똑같이 클래스를 만들어야 인증돼요.</p>
    <div class="tags"><span class="base">${esc(CONFIG.BASE_CLASS)}</span>${POSE_CLASSES.map(c=>`<span>${esc(c)}</span>`).join('')}</div></div>
   ${u.kind==='local'?'<button class="ghost" data-act="reset" id="resetBtn">내 기록 초기화</button>':''}
  </div>`;
  const sel=document.getElementById('voiceSel');
  if(sel) sel.onchange=()=>{ DEV.voiceName=sel.value; saveDev(); pickVoice(); speak('좋아요, 그대로 유지해요!',true); };
}

/* ---------- 이벤트 ---------- */
let resetArmed=false;
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const a=el.dataset.act;
  if(a==='intro'){ openIntro(); return; }
  if(a==='introClose'){ closeIntro(); return; }
  if(a==='introNext'){ introStep(UI.intro+1); return; }
  if(a==='introPrev'){ introStep(UI.intro-1); return; }
  if(a==='introGo'){ introStep(+el.dataset.k); return; }
  if(a==='tab'){ if(UI.screen==='play'){ stopPlay(); UI.screen='result'; } UI.tab=el.dataset.k; if(el.dataset.b) UI.book=el.dataset.b; if(UI.tab==='rank') RANK.err=''; render(); window.scrollTo(0,0);
    const tb=UI.tab; if((tb==='tree'||tb==='book')&&DEV.user.kind==='server') api('stats',{}).then(r=>{ if(r.ok){ UI.classFeel=r.feel; if(UI.tab===tb&&!UI.gate) render(); } });
    return; }
  if(a==='gps'){ useGps(); return; }
  if(a==='pickmap'){ TW.me=null; TW.warn=false; TW.note='지도에서 지금 있는 곳을 눌러 보세요. 가까운 순서로 알려 줄게요.'; UI.town='map'; }
  else if(a==='town'){ UI.town=el.dataset.k; }
  else if(a==='spot'){ openSpot(+el.dataset.k); return; }
  else if(a==='townBack'){ UI.screen='check'; UI.step=1; }
  else if(a==='townGo'){ if(UI.tab!=='today'){ UI.tab='today'; UI.pick={}; } UI.err='';
    UI.pick.p='town'; UI.pick.spot=SPOTS[UI.spotI]; UI.screen='check'; UI.step=UI.pick.b?2:0; }
  else if(a==='book'){ UI.book=el.dataset.k; }
  else if(a==='rankp'){ RANK.period=el.dataset.k; }
  else if(a==='rankRetry'){ RANK.err=''; render(); loadRank(true); return; }
  else if(a==='dex'){ const [b,p]=el.dataset.k.split('|'); UI.tab='today'; UI.pick={b,p}; UI.err=''; UI.screen='check'; UI.step=2; }
  else if(a==='gate'){ UI.gate=el.dataset.k; UI.gateErr=''; if(el.dataset.k==='welcome') UI.form={}; }
  else if(a==='guest'){ DEV.user={kind:'guest',name:'손님'}; saveDev(); loadUser(); Object.assign(UI,{gate:null,tab:'today',screen:'home'}); }
  else if(a==='resume'){ DEV.user.at=Date.now(); saveDev(); UI.gate=null; render(); refresh(); return; }
  else if(a==='logout'){ if(UI.running) stopPlay(); logout(); }
  else if(a==='start'){ UI.screen='check'; UI.step=0; UI.pick={}; UI.err=''; }
  else if(a==='pick'){ const key=QS[UI.step].key;
    if(key==='p'&&el.dataset.k==='town'){ UI.screen='town'; UI.town=TW.me?'map':'ask'; }
    else{ UI.pick[key]=el.dataset.k; if(key==='p') delete UI.pick.spot;
      if(UI.step===0&&UI.pick.p==='town'&&UI.pick.spot) UI.step=2;   /* 동네 탭에서 장소를 먼저 고른 경우 */
      else if(UI.step<2) UI.step++; else UI.screen='result'; } }
  else if(a==='back'){ UI.err=''; if(UI.screen==='result'){UI.screen='check';UI.step=2;} else if(UI.step>0) UI.step--; else UI.screen='home'; }
  else if(a==='mode'){ startMode(el.dataset.k); return; }
  else if(a==='pause'){ setPaused(!UI.paused); vsCall(UI.paused?'pauseVideo':'playVideo'); return; }
  else if(a==='vfree'){ vsOff(); return; }
  else if(a==='vtap'){ vsTap(); return; }
  else if(a==='vfull'){ vsFull(); return; }
  else if(a==='skip'){ UI.results[UI.idx]='skip'; advance(); return; }
  else if(a==='voice'){ DEV.voice=!DEV.voice; saveDev(); el.textContent=DEV.voice?'음성 안내 켬':'음성 안내 끔'; if(!DEV.voice&&'speechSynthesis' in window) speechSynthesis.cancel(); else announce(false); return; }
  else if(a==='quit'){ stopPlay(); UI.screen='result'; }
  else if(a==='feel'){ applyResult(+el.dataset.k); window.scrollTo(0,0); return; }
  else if(a==='home'){ UI.screen='home'; }
  else if(a==='saveInfo'){
    const m=document.getElementById('modelInput'); if(m){ DEV.modelUrl=m.value.trim(); }
    saveDev(); render(); const b=document.getElementById('saveBtn'); if(b) b.textContent='저장했어요'; return;
  }
  else if(a==='voiceTest'){ speak('목 스트레칭, 시작할게요. 귀를 어깨 쪽으로 천천히 내려요. 5초 남았어요.',true); return; }
  else if(a==='reset'){
    if(!resetArmed){ resetArmed=true; el.textContent='한 번 더 누르면 기록이 모두 지워져요'; return; }
    resetArmed=false; S=BLANK(); save();
  }
  render(); window.scrollTo(0,0);
});
document.addEventListener('submit',e=>{ if(e.target.id!=='gateForm') return; e.preventDefault(); if(!UI.busy) submitGate(e.target); });
document.addEventListener('keydown',e=>{
  if(UI.intro!=null){   /* 사용법 팝업: Esc 닫기, 화살표 넘기기, Tab은 팝업 안에서만 돌아요 */
    if(e.key==='Escape'){ e.preventDefault(); closeIntro(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); introStep(UI.intro+1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); introStep(UI.intro-1); }
    else if(e.key==='Tab'){ const f=[...document.querySelectorAll('#intro .mbox button')]; if(!f.length) return;
      const i=f.indexOf(document.activeElement), n=e.shiftKey?(i<=0?f.length-1:i-1):(i<0||i===f.length-1?0:i+1); e.preventDefault(); f[n].focus(); }
    return; }
  if(e.code==='Space'&&UI.running&&UI.demo&&!/INPUT|BUTTON/.test(e.target.tagName)){ e.preventDefault(); UI.holding=true; } });
/* 사용법 팝업은 손가락으로 밀어서 넘길 수도 있어요 */
let introX=null;
document.addEventListener('touchstart',e=>{ introX=UI.intro!=null&&e.target.closest('.mbox')?e.touches[0].clientX:null; },{passive:true});
document.addEventListener('touchend',e=>{ if(introX==null||UI.intro==null) return; const dx=e.changedTouches[0].clientX-introX; introX=null; if(Math.abs(dx)>50) introStep(UI.intro+(dx<0?1:-1)); },{passive:true});
document.addEventListener('keyup',e=>{ if(e.code==='Space') UI.holding=false; });

/* 시작: 지난번 사용자가 있으면 "계속할까요?"를 묻고, 비밀번호가 있는 사람은 30분이 지나면 다시 비밀번호를 받아요 */
(function start(){
  const u=DEV.user;
  if(u&&(u.kind==='guest'||(CONFIG.SERVER_URL?'server':'local')!==u.kind)){ DEV.user=null; saveDev(); }
  else if(u&&u.hasPin&&Date.now()-(u.at||0)>30*60*1000){ UI.form={name:u.name}; DEV.user=null; saveDev(); UI.gate='login'; }
  else if(u){ UI.gate='resume'; }
  loadUser(); render();
  if(!DEV.introSeen) openIntro();   /* 이 기기에서 처음 열 때만 사용법 팝업 */
})();
</script>
</body>
</html>
