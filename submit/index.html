<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>튼튼이 365 제출함</title>
<link rel="icon" href="../app/img/tuntuni_1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 튼튼이 365 앱과 같은 색: 하늘색 배경, 남색 글자, 파란 버튼, 초록 365 */
:root{
  --bg:#EEF5FC; --surface:#FFFFFF; --surface-2:#E3EDF8; --ink:#1B2F55; --muted:#55657E; --line:#D3E0EE;
  --accent:#2F5FD0; --accent-soft:#DCE6FB; --teal:#1A8A4C; --teal-soft:#D6F1E1; --sun:#8A5A00; --sun-line:#E9A817; --sun-soft:#FDF0CC;
  --violet:#5B45D6; --violet-soft:#E7E2FF; --warn:#B4541F; --warn-soft:#FBE6DA;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.25}
.wrap{max-width:960px;margin:0 auto;padding:20px 18px 64px}
.jua{font-family:var(--display)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 머리 */
.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.top img{width:84px;height:78px;object-fit:contain;flex-shrink:0}
.top h1{font-size:34px}
.top h1 b{font-weight:400;color:var(--teal)}
.top p{margin:2px 0 0;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:500}

/* 공통 상자 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.card + .card{margin-top:14px}
.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.sec-title h2{font-size:24px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 나는 누구? */
.who h2{font-size:22px;margin-bottom:10px}
.groups{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.gbtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:64px}
.gbtn .n{font-family:var(--display);font-size:22px}
.gbtn .b{font-size:13px;color:var(--muted)}
.gbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.gbtn[aria-pressed="true"] .b{color:#E6EDFF}
.fields2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px}
label.f .lb{display:block}
label.f span.h{font-weight:400;color:var(--muted);font-size:13px}
input[type=text],input[type=url],input[type=number],input[type=password],textarea,select{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-height:46px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

/* 할 일 카드 */
.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.task{--c:var(--accent);--cs:var(--accent-soft);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--c)}
.task.t1{--c:var(--teal);--cs:var(--teal-soft)}
.task.t3{--c:var(--sun-line);--cs:var(--sun-soft)}
.task.t4{--c:var(--violet);--cs:var(--violet-soft)}
.task .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.task .num{font-family:var(--display);font-size:40px;line-height:1;color:var(--c)}
.task.t3 .num{color:var(--sun)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:700;background:var(--cs);color:var(--ink)}
.task h3{font-size:24px}
.task p{margin:0;color:var(--muted)}
.task .state{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;margin-top:2px}
.task .state.ok{color:var(--teal)}
.task .go{margin-top:auto;align-self:flex-start}
.locked .task{opacity:.55}

/* 버튼 */
.btn{border:0;border-radius:14px;padding:12px 20px;background:var(--accent);color:#fff;font-weight:700;min-height:48px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.big{font-size:18px;padding:14px 26px}
.btn svg{width:20px;height:20px}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0;display:inline-flex;align-items:center;gap:6px;min-height:44px}

/* 과제 화면 */
.page-head{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.page-head .num{font-family:var(--display);font-size:52px;line-height:1;color:var(--c)}
.page-head h2{font-size:32px}
.what{background:var(--cs);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:500}
.what b{font-family:var(--display);font-weight:400;font-size:19px;display:block;margin-bottom:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps > li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.steps .sn{width:40px;height:40px;border-radius:99px;background:var(--c);color:#fff;font-family:var(--display);font-size:22px;display:flex;align-items:center;justify-content:center}
.t3p .steps .sn{color:var(--ink)}
.steps h3{font-size:20px;margin-bottom:2px}
.steps p{margin:0;color:var(--muted)}
.steps ul{margin:4px 0 0;padding-left:20px;color:var(--muted)}
.ex{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.ex div{border-radius:12px;padding:8px 10px;font-size:14px}
.ex .bf{background:#F3F4F6}
.ex .af{background:var(--teal-soft)}
.ex .ar{color:var(--muted);font-size:20px}

/* 검사표 */
.checks{display:grid;gap:8px}
.ck{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.ck .bx{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--teal);display:flex;align-items:center;justify-content:center;background:#fff}
.ck .bx svg{width:20px;height:20px;opacity:0}
.ck[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.ck[aria-pressed="true"] .bx{background:var(--teal)}
.ck[aria-pressed="true"] .bx svg{opacity:1}
.ck b{display:block;font-size:17px}
.ck span{color:var(--muted);font-size:14px}
.progress-line{font-weight:700;margin-top:10px}

/* 제출 폼 */
form.sub{display:grid;gap:14px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700;min-height:44px}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop{border:2.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:8px}
.drop > span{display:flex;flex-direction:column;align-items:center;gap:6px}
.drop img,.drop video{max-width:100%;max-height:260px;border-radius:12px}
.drop .fname{font-size:14px;color:var(--muted);word-break:break-all}
.need{color:var(--warn)}
.bar{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.done-box{text-align:center;padding:28px 18px}
.done-box .big{font-family:var(--display);font-size:30px;color:var(--teal)}
.list-sent{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.list-sent span{background:var(--teal-soft);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:500}
.err{color:var(--warn);font-weight:700}

/* 인증 시험기 */
.tester{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#1B2F55;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:#C9D6EE;text-align:center;padding:0}
.cam canvas{width:100%;height:100%;display:block}
.cam .ph{padding:20px;font-size:15px}
.timer{position:absolute;left:10px;top:10px;background:rgba(27,47,85,.85);color:#fff;border-radius:12px;padding:6px 12px;font-family:var(--display);font-size:28px;line-height:1}
.pill{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;border-radius:12px;padding:8px;font-weight:700;background:rgba(255,255,255,.92);color:var(--ink)}
.pill.ok{background:var(--teal);color:#fff}
.probs{display:grid;gap:6px;margin-top:6px}
.pb{display:grid;grid-template-columns:minmax(0,120px) 1fr 44px;gap:8px;align-items:center;font-size:14px}
.pb .t{height:16px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.pb .t i{position:absolute;left:0;top:0;bottom:0;background:#9BB0D6}
.pb.target .t i{background:var(--accent)}
.pb.target.ok .t i{background:var(--teal)}
.pb .th{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:80%}
.pb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb.target span:first-child{font-weight:700}
table.log{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
table.log th{color:var(--muted);font-weight:700}
.okt{color:var(--teal);font-weight:700}.not{color:var(--warn);font-weight:700}
.crit{display:grid;gap:8px;margin-top:6px}
.crit div{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.crit div.ok{background:var(--teal-soft)}
.crit .dot{width:24px;height:24px;border-radius:99px;border:2.5px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.crit div.ok .dot{border-color:var(--teal);background:var(--teal)}
.crit .dot svg{width:15px;height:15px;opacity:0}.crit div.ok .dot svg{opacity:1}

/* 반 제출 현황 */
table.stat{width:100%;border-collapse:collapse;background:var(--surface);border-radius:16px;overflow:hidden}
table.stat th,table.stat td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
table.stat th{background:var(--surface-2);font-size:14px}
table.stat td:first-child{text-align:left;font-weight:700}
table.stat tr.me td{background:var(--accent-soft)}
.foot{margin-top:30px;text-align:center;color:var(--muted);font-size:14px}

@media (max-width:720px){
  table.stat td:first-child .small{display:none}
  table.stat th{font-size:12px}
  .tasks{grid-template-columns:1fr}
  .groups{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fields2{grid-template-columns:1fr}
  .tester{grid-template-columns:1fr}
  .top h1{font-size:28px}
  .page-head h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="../app/img/tuntuni_1.png" alt="튼튼이 365 곰돌이">
    <div>
      <h1>튼튼이 365 <b>제출함</b></h1>
      <p>6학년 3반 · 이번 주 우리 모둠이 할 일을 번호 순서대로 해요</p>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="main"></main>
  <p class="foot">막히면 손을 들고 선생님을 불러요. 내가 낸 그림·영상은 선생님 구글 드라이브에만 저장돼요.</p>
</div>

<script>
/* ======================= 선생님 설정 ======================= */
const CONFIG = {
  // 제출함 앱스 스크립트 웹 앱 주소 (제출함_설치방법.md). 비워 두면 "연습 모드"로 열리고 저장되지 않아요.
  SERVER_URL: 'https://script.google.com/macros/s/AKfycby9C43AY-soudEuxm3QMl1lxS4gXDWBEdk2QqiCSTXutInXSetmvL6MeV5N4ToFJg/exec',
  // 동작 다듬기에서 보여 줄 참고 영상 패들렛
  REF_URL: 'https://padlet.com/didxodudd/padlet-s0253jkdh1jla41vrwk5',
  THRESHOLD: 0.8,      // 앱과 같은 인정 기준 (80%)
  TEST_LIMIT: 30       // 인증 시험: 이 시간(초) 안에 못 채우면 실패
};
const GROUPS = [
  {n:'1',body:'허리'},{n:'2',body:'다리'},{n:'3',body:'목·어깨'},
  {n:'4',body:'스마트폰'},{n:'5',body:'피곤·졸림'},{n:'6',body:'스트레스'}
];
/* ========================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'
};

/* ---------- 기기에 기억하는 것: 모둠, 이름, 반 코드, 검사표, 시험 기록 ---------- */
const KEY = 'tuntuni-submit-v1';
let ME = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
ME.checks = ME.checks || {}; ME.tests = ME.tests || {}; ME.tm = ME.tm || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(ME)); } catch (e) {} }
const G = () => GROUPS.find(g => g.n === ME.group);

/* ---------- 서버 ---------- */
let STATUS = null;
async function api(action, data, ms = 20000) {
  if (window.__MOCK__) return window.__MOCK__(action, data);
  if (!CONFIG.SERVER_URL) return { ok: false, error: 'noserver' };
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(CONFIG.SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data)), signal: ac.signal });
    return await r.json();
  } catch (e) { return { ok: false, error: 'network' }; }
  finally { clearTimeout(tm); }
}
const ERR = {
  code: '반 코드가 맞지 않아요. 맨 위 "나는 누구?"에서 반 코드를 다시 넣어요.',
  network: '인터넷이 끊겼거나 느려요. 잠시 뒤 다시 눌러 봐요.',
  noserver: '아직 연습 모드예요. 선생님이 저장 주소를 넣으면 진짜로 저장돼요.',
  size: '파일이 너무 커요 (300MB까지). 짧게 잘라서 올려요.',
  type: '사진이나 영상 파일만 올릴 수 있어요.',
  group: '먼저 모둠을 골라요.',
  expired: '올리는 시간이 너무 오래 걸렸어요. 처음부터 다시 올려요.'
};
const errText = r => ERR[r && r.error] || ('저장하지 못했어요. 선생님께 알려 주세요. (' + esc((r && (r.message || r.error)) || '?') + ')');
async function loadStatus() {
  const r = await api('status', {});
  if (r && r.ok) { STATUS = r.groups; if (route() === 'home') render(); }
}
function mine() { return (STATUS && ME.group && STATUS[ME.group]) || null; }

/* 파일 올리기: 4MB 조각으로 나눠서 차례로 보내요 (긴 영상도 올라가요) */
const CHUNK = 4 * 1024 * 1024;
function b64(blob) {
  return new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(',')[1] || ''); fr.onerror = no; fr.readAsDataURL(blob); });
}
async function uploadFile(file, name, onProg) {
  const mime = file.type || (/\.mov$/i.test(file.name) ? 'video/quicktime' : /\.(mp4|m4v)$/i.test(file.name) ? 'video/mp4' : '');
  const st = await api('upStart', { code: ME.code, group: ME.group, name, mime, size: file.size });
  if (!st.ok) return st;
  let off = 0;
  while (off < file.size) {
    const part = file.slice(off, Math.min(off + CHUNK, file.size));
    const data = await b64(part);
    let r = null;
    for (let i = 0; i < 3; i++) {   // 끊기면 3번까지 다시
      r = await api('upChunk', { code: ME.code, id: st.id, offset: off, data }, 120000);
      if (r.ok || r.error !== 'network') break;
      await new Promise(w => setTimeout(w, 1500));
    }
    if (!r.ok) return r;
    if (r.done) { onProg && onProg(1); return r; }
    off = r.next > off ? r.next : off + part.size;
    onProg && onProg(off / file.size);
  }
  return { ok: false, error: 'range' };
}

/* 사진은 보내기 전에 1600px로 줄여요 (빨리 올라가요) */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.86));
    return blob && blob.size < file.size ? new File([blob], 'photo.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}
const nowTag = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };

/* ---------- 화면 이동 ---------- */
const route = () => (location.hash.replace(/^#\/?/, '') || 'home');
window.addEventListener('hashchange', () => { stopTest(); render(); window.scrollTo(0, 0); });

const TASKS = [
  { id: 't1', n: '01', day: '월요일', title: '동작 다듬기', line: '검사표 5개로 우리 동작을 점검하고 고쳐요. 새로 만들지 않아요!' },
  { id: 't2', n: '02', day: '월요일', title: '동작 카드 내기', line: '튼튼이 그림 사진 + 설명 3줄을 동작마다 하나씩 내요.' },
  { id: 't3', n: '03', day: '화요일', title: '티처블 머신 시험·내기', line: '다른 친구 자세도 알아보는지 여기서 시험하고 모델 링크를 내요.' },
  { id: 't4', n: '04', day: '하고 싶으면', title: '기념 영상 올리기', line: '우리가 찍은 영상을 반 기념으로 모아요. 앱에는 안 들어가요.' }
];

function render() {
  const r = route(), m = $('#main');
  const b = $('#banner');
  b.hidden = !!(CONFIG.SERVER_URL || window.__MOCK__);
  b.textContent = '연습 모드: 아직 저장 주소가 없어서 제출해도 저장되지 않아요.';
  if (r === 't1') m.innerHTML = pageT1();
  else if (r === 't2') m.innerHTML = pageT2();
  else if (r === 't3') m.innerHTML = pageT3();
  else if (r === 't4') m.innerHTML = pageT4();
  else m.innerHTML = pageHome();
  after(r);
}

/* ---------- 첫 화면 ---------- */
function pageHome() {
  const s = mine(), set = !!ME.group;
  const state = t => {
    if (!set) return '';
    if (t.id === 't1') { const n = Object.values(ME.checks[ME.group] || {}).filter(Boolean).length; return n >= 5 ? `<div class="state ok">${IC.check.replace('#fff', 'currentColor').replace('<svg', '<svg width="18" height="18"')} 검사표 5개 모두 통과</div>` : `<div class="state">검사표 ${n} / 5</div>`; }
    if (!s) return '';
    const k = { t2: 'card', t3: 'tm', t4: 'video' }[t.id], c = s[k] || 0;
    return c ? `<div class="state ok">${IC.check.replace('#fff', 'currentColor').replace('<svg', '<svg width="18" height="18"')} 우리 모둠 ${c}개 냈어요</div>` : '<div class="state">아직 안 냈어요</div>';
  };
  return `
  <section class="card who" aria-labelledby="whoH">
    <h2 id="whoH">나는 누구? <span class="small muted">처음 한 번만 고르면 기억해요</span></h2>
    <div class="groups" role="group" aria-label="우리 모둠">
      ${GROUPS.map(g => `<button type="button" class="gbtn" data-group="${g.n}" aria-pressed="${ME.group === g.n}"><span class="n">${g.n}모둠</span><span class="b">${g.body}</span></button>`).join('')}
    </div>
    <div class="fields2">
      <label class="f"><span class="lb">내 이름</span><span class="h">제출한 사람으로 선생님께만 보여요</span><input type="text" id="who" maxlength="20" autocomplete="off" value="${esc(ME.who || '')}" placeholder="예: 김튼튼"></label>
      <label class="f"><span class="lb">반 코드</span><span class="h">선생님이 알려 준 숫자</span><input type="password" inputmode="numeric" id="code" maxlength="10" autocomplete="off" value="${esc(ME.code || '')}" placeholder="●●●"></label>
    </div>
  </section>

  <div class="sec-title"><h2>이번 주 할 일</h2><span class="muted small">${set ? esc(G().n + '모둠 · ' + G().body) : '먼저 위에서 모둠을 골라요'}</span></div>
  <div class="tasks ${set ? '' : 'locked'}">
    ${TASKS.map(t => `
      <article class="task ${t.id}">
        <div class="head"><span class="num">${t.n}</span><span class="chip">${t.day}</span></div>
        <h3>${t.title}</h3>
        <p>${t.line}</p>
        ${state(t)}
        <a class="btn go" href="#/${t.id}" ${set ? '' : 'aria-disabled="true" tabindex="-1" data-locked="1"'}>시작하기 ${IC.arrow}</a>
      </article>`).join('')}
  </div>

  <div class="sec-title"><h2>우리 반 제출 현황</h2><button type="button" class="btn soft" id="refresh" style="min-height:40px;padding:6px 14px">새로 고침</button></div>
  ${STATUS ? `<table class="stat"><thead><tr><th scope="col">모둠</th><th scope="col">02 동작 카드</th><th scope="col">03 티처블 머신</th><th scope="col">04 기념 영상</th></tr></thead><tbody>
    ${GROUPS.map(g => { const x = STATUS[g.n] || {}; const c = v => v ? `<span class="okt">${v}개</span>` : '<span class="muted">-</span>';
      return `<tr class="${ME.group === g.n ? 'me' : ''}"><td>${g.n}모둠 <span class="muted small">${g.body}</span></td><td>${c(x.card)}</td><td>${c(x.tm)}</td><td>${c(x.video)}</td></tr>`; }).join('')}
  </tbody></table>` : `<p class="muted">${CONFIG.SERVER_URL || window.__MOCK__ ? '불러오는 중이에요…' : '저장 주소가 생기면 여기에 모둠별 제출 개수가 보여요.'}</p>`}`;
}

/* ---------- 01 동작 다듬기 ---------- */
const CHECKS = [
  ['효과', '직접 해 보면 우리 부위가 당기거나 시원한 느낌이 들어요.'],
  ['멈춤 자세', '시작 자세와 끝 자세가 분명해요. (카메라 인증도 이 자세로 해요)'],
  ['숫자', '몇 초, 몇 번, 숨은 언제 쉬는지 정했어요.'],
  ['양쪽', '한쪽만 하는 동작이면 반대쪽도 해요.'],
  ['안전', '튕기거나 세게 돌리지 않아요. 아프면 멈춰요. 집에서는 뛰지 않아요.']
];
function pageT1() {
  const c = ME.checks[ME.group] || {}, n = CHECKS.filter((_, i) => c[i]).length;
  return `
  <div style="--c:var(--teal);--cs:var(--teal-soft)">
    <button type="button" class="back" data-go="home">${IC.back} 처음으로</button>
    <div class="page-head"><span class="num">01</span><h2>동작 다듬기</h2></div>
    <div class="what"><b>무엇을 하나요?</b>우리가 만든 동작을 검사표로 점검하고 고쳐요. 새 동작을 만들지 않아요. 5개를 모두 통과하면 완성!</div>

    <div class="sec-title"><h2>검사표</h2><span class="muted small">모둠원이 함께 직접 해 보며 눌러요</span></div>
    <div class="checks">
      ${CHECKS.map((k, i) => `<button type="button" class="ck" data-check="${i}" aria-pressed="${!!c[i]}"><span class="bx">${IC.check}</span><span><b>${i + 1}. ${k[0]}</b><span>${k[1]}</span></span></button>`).join('')}
    </div>
    <p class="progress-line" aria-live="polite">${n >= 5 ? '모두 통과! 이제 02 동작 카드를 내요.' : `${n} / 5 통과 · 못 지킨 칸이 곧 고칠 점이에요`}</p>

    <div class="sec-title"><h2>이렇게 다듬어요</h2></div>
    <ol class="steps">
      <li><span class="sn">1</span><div><h3>전문가 영상과 비교해요</h3><p>참고 영상에서 비슷한 동작을 찾아 보고, 우리 동작과 다른 점 1가지를 찾아 고쳐요.</p>
        <p style="margin-top:8px"><a class="btn ghost" href="${esc(CONFIG.REF_URL)}" target="_blank" rel="noopener">${IC.play} 참고 영상 보기</a></p></div></li>
      <li><span class="sn">2</span><div><h3>숫자와 숨쉬기를 붙여요</h3><p>같은 동작도 수준이 확 올라가요.</p>
        <div class="ex"><div class="bf">목 기울이기</div><span class="ar" aria-hidden="true">→</span><div class="af">숨 내쉬며 천천히 기울이고 10초 버티기, 양쪽 2번</div></div></div></li>
      <li><span class="sn">3</span><div><h3>2분 루틴으로 묶어요</h3><p>동작 3개를 순서대로 이어요: <b>풀기 → 늘리기 → 숨 고르기</b></p></div></li>
    </ol>
    <p style="margin-top:18px"><a class="btn big" href="#/t2">다 했어요 · 02 동작 카드 내기 ${IC.arrow}</a></p>
  </div>`;
}

/* ---------- 02 동작 카드 ---------- */
let F2 = null;
function pageT2() {
  const s = mine(), sent = (s && s.cards) || [];
  F2 = F2 || { place: [], pose: '' };
  return `
  <div style="--c:var(--accent);--cs:var(--accent-soft)">
    <button type="button" class="back" data-go="home">${IC.back} 처음으로</button>
    <div class="page-head"><span class="num">02</span><h2>동작 카드 내기</h2></div>
    <div class="what"><b>무엇을 하나요?</b>동작 하나에 카드 한 장! 튼튼이 그림 사진과 설명을 내요. 우리 동작이 4개면 4번 내요.</div>

    <div class="sec-title"><h2>순서</h2></div>
    <ol class="steps">
      <li><span class="sn">1</span><div><h3>튼튼이 그림을 그려요</h3><p>종이에 곰돌이 튼튼이가 우리 동작을 하는 모습을 그려요.</p><ul><li>시작 자세는 연하게, 끝 자세는 진하게</li><li>움직이는 방향은 빨간 화살표</li></ul></div></li>
      <li><span class="sn">2</span><div><h3>사진을 찍어요</h3><ul><li>밝은 곳에서, 종이 위에서 똑바로</li><li>종이가 화면에 꽉 차게, 손가락이 나오지 않게</li></ul></div></li>
      <li><span class="sn">3</span><div><h3>설명 3줄을 써요</h3><p><b>통과 기준:</b> 다른 모둠 친구가 설명만 읽고 똑같이 따라 할 수 있어요. 바꿔 읽어 보고 고쳐요.</p></div></li>
    </ol>

    ${sent.length ? `<div class="card" style="margin-top:16px"><b>우리 모둠이 낸 동작 (${sent.length})</b><div class="list-sent">${sent.map(t => `<span>${esc(t)}</span>`).join('')}</div></div>` : ''}

    <div class="sec-title"><h2>카드 내기</h2></div>
    <div class="card" id="box2">
    <form class="sub" id="f2" novalidate>
      <label class="f"><span class="lb">동작 이름 <span class="need">*</span></span><input type="text" name="title" maxlength="30" required placeholder="예: 목 옆으로 기울이기"></label>
      <div class="f"><span style="font-weight:700">어디서 하나요? <span class="need">*</span> <span class="h small muted" style="font-weight:400">여러 개 골라도 돼요</span></span>
        <div class="choice" role="group" aria-label="장소">${['교실', '운동장', '집'].map(p => `<button type="button" data-place="${p}" aria-pressed="${F2.place.includes(p)}">${p}</button>`).join('')}</div></div>
      <label class="f"><span class="lb">① 시작 자세 <span class="need">*</span></span><input type="text" name="start" maxlength="80" required placeholder="예: 의자에 바르게 앉아 허리를 펴요."></label>
      <label class="f"><span class="lb">② 움직임 <span class="need">*</span></span><input type="text" name="move" maxlength="80" required placeholder="예: 숨을 내쉬며 귀를 어깨 쪽으로 천천히 기울여요."></label>
      <label class="f"><span class="lb">③ 시간·횟수 <span class="need">*</span></span><input type="text" name="count" maxlength="60" required placeholder="예: 10초 버티기, 양쪽 2번"></label>
      <label class="f"><span class="lb">주의할 점</span><input type="text" name="caution" maxlength="60" placeholder="예: 아프면 바로 멈춰요."></label>
      <div class="f"><span style="font-weight:700">카메라로 인증하는 동작인가요? <span class="need">*</span></span>
        <div class="choice" role="group" aria-label="카메라 인증">${['예', '아니요'].map(p => `<button type="button" data-pose="${p}" aria-pressed="${F2.pose === p}">${p}</button>`).join('')}</div></div>
      <div class="fields2" id="poseBox" ${F2.pose === '예' ? '' : 'hidden'} style="margin-top:0">
        <label class="f"><span class="lb">클래스 이름</span><span class="h">티처블 머신과 띄어쓰기까지 똑같이</span><input type="text" name="cls" maxlength="30" placeholder="예: 목 기울이기"></label>
        <label class="f"><span class="lb">인증 시간(초)</span><span class="h">권장 10초</span><input type="number" name="sec" min="3" max="30" value="10"></label>
      </div>
      <div class="f"><span style="font-weight:700">그림 사진 <span class="need">*</span></span>
        <label class="drop" id="drop2">
          <input type="file" id="file2" accept="image/*" hidden>
          <span id="prev2">${IC.cam.replace('<svg', '<svg width="34" height="34"')}<b>여기를 눌러 사진 고르기</b><span class="small muted">크롬북·휴대폰 카메라로 바로 찍어도 돼요</span></span>
        </label></div>
      <div id="prog2" hidden><div class="bar"><i></i></div><p class="small muted" style="margin:6px 0 0">올리는 중… 창을 닫지 마세요</p></div>
      <p class="err" id="err2" aria-live="polite"></p>
      <button class="btn big" type="submit">${IC.up} 카드 내기</button>
    </form>
    </div>
  </div>`;
}

/* ---------- 03 티처블 머신 ---------- */
function pageT3() {
  const tm = ME.tm[ME.group] || {};
  return `
  <div class="t3p" style="--c:var(--sun-line);--cs:var(--sun-soft)">

    <div class="page-head"><span class="num" style="color:var(--sun)">03</span><h2>티처블 머신 시험·내기</h2></div>

        <li>클래스 이름은 동작 카드와 <b>띄어쓰기까지 똑같이</b></li></ul></div></li>
      <li><span class="sn">2</span><div><h3>모델 링크를 복사해요</h3><p>[모델 내보내기] → [모델 업로드] → 나온 링크 <b>복사</b>. 예: https://teachablemachine.withgoogle.com/models/AbCd123/</p></div></li>

          <div style="display:grid;gap:12px">
            <label class="f"><span class="lb">시험할 동작 (클래스)</span><select id="tCls">${TM.classes.map(c => `<option ${c === TM.cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
            <label class="f"><span class="lb">인증 시간(초)</span><input type="number" id="tSec" min="3" max="30" value="${TM.sec}"></label>
            <div class="f"><span style="font-weight:700">누가 시험하나요?</span>
              <div class="choice" role="group" aria-label="시험하는 사람">${[['mine', '우리 모둠'], ['other', '다른 모둠 친구']].map(p => `<button type="button" data-tester="${p[0]}" aria-pressed="${TM.who === p[0]}">${p[1]}</button>`).join('')}</div></div>

/* ---------- 04 기념 영상 ---------- */
function pageT4() {
  return `
  <div style="--c:var(--violet);--cs:var(--violet-soft)">
    <button type="button" class="back" data-go="home">${IC.back} 처음으로</button>
    <div class="page-head"><span class="num" style="color:var(--violet)">04</span><h2>기념 영상 올리기</h2></div>
    <div class="what"><b>무엇을 하나요?</b>우리 모둠이 찍은 영상을 반 기념으로 모아요. 앱에는 들어가지 않아요. 하고 싶은 모둠만 해요.</div>
    <ol class="steps" style="margin-top:14px">
      <li><span class="sn">1</span><div><h3>얼굴이 부담되면 목 아래만 나와도 돼요</h3><p>친구 얼굴이 나오면 친구에게 먼저 물어봐요.</p></div></li>
      <li><span class="sn">2</span><div><h3>패들렛에 이미 올렸다면 안 올려도 돼요</h3></div></li>
    </ol>
    <div class="sec-title"><h2>영상 올리기</h2></div>
    <div class="card" id="box4">
    <form class="sub" id="f4" novalidate>
      <label class="f"><span class="lb">제목 <span class="need">*</span></span><input type="text" name="title" maxlength="40" placeholder="예: 1모둠 허리 쭉쭉 체조"></label>
      <label class="f"><span class="lb">한 줄 소개</span><input type="text" name="about" maxlength="80" placeholder="예: 쉬는 시간에 의자에서 하는 2분 체조예요."></label>
      <div class="f"><span style="font-weight:700">영상 파일 <span class="need">*</span> <span class="h small muted" style="font-weight:400">300MB까지</span></span>
        <label class="drop"><input type="file" id="file4" accept="video/*" hidden>
          <span id="prev4">${IC.up.replace('<svg', '<svg width="34" height="34"')}<b>여기를 눌러 영상 고르기</b></span></label></div>
      <div id="prog4" hidden><div class="bar"><i></i></div><p class="small muted" style="margin:6px 0 0" id="pct4">올리는 중… 창을 닫지 마세요</p></div>
      <p class="err" id="err4" aria-live="polite"></p>
      <button class="btn big" type="submit">${IC.up} 영상 올리기</button>
    </form>
    </div>
  </div>`;
}

function doneBox(msg, again) {
  return `<div class="done-box"><div class="big">제출 완료!</div><p>${msg}</p>
    <div class="row" style="justify-content:center"><button type="button" class="btn" data-again="${again}">하나 더 내기</button><a class="btn ghost" href="#/">처음으로</a></div></div>`;
}
function needWho() {
  if (!ME.group) return '먼저 처음 화면에서 모둠을 골라요.';
  if (!ME.who) return '처음 화면 "나는 누구?"에 내 이름을 써요.';
  if (!ME.code && CONFIG.SERVER_URL) return '처음 화면 "나는 누구?"에 반 코드를 넣어요.';
  return '';
}

/* ---------- 화면별 동작 연결 ---------- */
let FILE2 = null, FILE4 = null;
function after(r) {
  if (r === 'home') {
    document.querySelectorAll('[data-group]').forEach(b => b.onclick = () => { if (ME.group !== b.dataset.group) { stopTest(); Object.assign(TM, { model: null, url: '', classes: [], cls: '' }); F2 = null; FILE2 = null; FILE4 = null; } ME.group = b.dataset.group; save(); render(); });
    const who = $('#who'), code = $('#code');
    who.oninput = () => { ME.who = who.value.trim(); save(); };
    code.oninput = () => { ME.code = code.value.trim(); save(); };
    $('#refresh').onclick = loadStatus;
    document.querySelectorAll('[data-locked]').forEach(a => a.onclick = e => { e.preventDefault(); document.querySelector('.gbtn').focus(); });
  }
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { location.hash = '#/'; });
  if (r !== 'home' && !ME.group) { location.hash = '#/'; return; }
  if (r === 't1') document.querySelectorAll('[data-check]').forEach(b => b.onclick = () => {
    const c = ME.checks[ME.group] = ME.checks[ME.group] || {}; c[b.dataset.check] = !c[b.dataset.check]; save(); render();
  });
  if (r === 't2') bindT2();
  if (r === 't3') bindT3();
  if (r === 't4') bindT4();
}

function bindT2() {
  const f = $('#f2');
  f.addEventListener('input', () => { $('#err2').textContent = ''; });
  document.querySelectorAll('[data-place]').forEach(b => b.onclick = () => {
    const p = b.dataset.place, i = F2.place.indexOf(p); i < 0 ? F2.place.push(p) : F2.place.splice(i, 1); b.setAttribute('aria-pressed', i < 0);
  });
  document.querySelectorAll('[data-pose]').forEach(b => b.onclick = () => {
    F2.pose = b.dataset.pose; document.querySelectorAll('[data-pose]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#poseBox').hidden = F2.pose !== '예';
  });
  const fi = $('#file2');
  fi.onchange = () => { FILE2 = fi.files[0] || null; if (FILE2) $('#prev2').innerHTML = `<img src="${URL.createObjectURL(FILE2)}" alt="고른 그림 사진 미리 보기"><span class="fname">${esc(FILE2.name)} · 다시 누르면 바꿀 수 있어요</span>`; };
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f)), err = $('#err2');
    const miss = needWho() || (!d.title.trim() ? '동작 이름을 써요.' : !F2.place.length ? '어디서 하는지 골라요.' : !d.start.trim() || !d.move.trim() || !d.count.trim() ? '설명 3줄(①②③)을 모두 써요.' : !F2.pose ? '카메라로 인증하는 동작인지 골라요.' : (F2.pose === '예' && !d.cls.trim()) ? '클래스 이름을 써요.' : !FILE2 ? '그림 사진을 골라요.' : '');
    if (miss) { err.textContent = miss; return; }
    err.textContent = ''; lockForm(f, true); $('#prog2').hidden = false;
    const img = await shrink(FILE2);
    const up = await uploadFile(img, `${ME.group}모둠_동작카드_${d.title.trim()}_${nowTag()}.jpg`, k => $('#prog2 i').style.width = Math.round(k * 100) + '%');
    if (!up.ok) { err.innerHTML = errText(up); lockForm(f, false); $('#prog2').hidden = true; return; }
    const r = await api('submit', { code: ME.code, group: ME.group, task: 'card', fields: {
      who: ME.who, title: d.title.trim(), place: F2.place.join(', '), start: d.start.trim(), move: d.move.trim(), count: d.count.trim(),
      caution: d.caution.trim(), pose: F2.pose, cls: F2.pose === '예' ? d.cls.trim() : '', sec: F2.pose === '예' ? d.sec : '', file: up.url } });
    if (!r.ok) { err.innerHTML = errText(r); lockForm(f, false); $('#prog2').hidden = true; return; }
    F2 = null; FILE2 = null;
    $('#box2').innerHTML = doneBox(`<b>${esc(d.title.trim())}</b> 카드가 선생님 드라이브에 저장됐어요.`, 't2');
    bindAgain(); loadStatus();
  };
}

function bindT4() {
  const f = $('#f4'), fi = $('#file4');
  fi.onchange = () => { FILE4 = fi.files[0] || null; if (FILE4) $('#prev4').innerHTML = `<video src="${URL.createObjectURL(FILE4)}" controls muted></video><span class="fname">${esc(FILE4.name)} · ${(FILE4.size / 1048576).toFixed(1)}MB</span>`; };
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f)), err = $('#err4');
    const miss = needWho() || (!d.title.trim() ? '제목을 써요.' : !FILE4 ? '영상 파일을 골라요.' : FILE4.size > 300 * 1048576 ? ERR.size : '');
    if (miss) { err.textContent = miss; return; }
    err.textContent = ''; lockForm(f, true); $('#prog4').hidden = false;
    const ext = (FILE4.name.match(/\.[a-z0-9]+$/i) || ['.mp4'])[0];
    const up = await uploadFile(FILE4, `${ME.group}모둠_기념영상_${d.title.trim()}_${nowTag()}${ext}`, k => { $('#prog4 i').style.width = Math.round(k * 100) + '%'; $('#pct4').textContent = `올리는 중… ${Math.round(k * 100)}% · 창을 닫지 마세요`; });
    if (!up.ok) { err.innerHTML = errText(up); lockForm(f, false); $('#prog4').hidden = true; return; }
    const r = await api('submit', { code: ME.code, group: ME.group, task: 'video', fields: { who: ME.who, title: d.title.trim(), about: d.about.trim(), file: up.url } });
    if (!r.ok) { err.innerHTML = errText(r); lockForm(f, false); $('#prog4').hidden = true; return; }
    FILE4 = null;
    $('#box4').innerHTML = doneBox('영상이 선생님 드라이브에 저장됐어요.', 't4');
    bindAgain(); loadStatus();
  };
}
function lockForm(f, on) { f.querySelectorAll('input,textarea,button').forEach(x => x.disabled = on); }
function bindAgain() { document.querySelectorAll('[data-again]').forEach(b => b.onclick = () => render()); }

/* ---------- 인증 시험기 (앱과 같은 방식) ---------- */
const TM = { model: null, url: '', classes: [], cls: '', sec: 10, who: 'mine', webcam: null, run: false, hist: [], held: 0, t0: 0, last: 0, ctx: null, raf: 0 };
function loadScript(src) {
  return new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
}
function normUrl(u) {
  u = String(u || '').trim();
  const m = u.match(/^https:\/\/teachablemachine\.withgoogle\.com\/models\/[A-Za-z0-9_-]+/);
  return m ? m[0] + '/' : '';
}
async function loadModel() {
  const raw = $('#mUrl').value, u = normUrl(raw), er = $('#mErr');
  if (!u) { er.textContent = '링크 모양이 달라요. teachablemachine.withgoogle.com/models/ 로 시작하는 링크를 붙여 넣어요.'; return; }
  er.textContent = '불러오는 중…'; $('#mLoad').disabled = true;
  try {
    if (!window.tmPose) {
      await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js');
      await loadScript('https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js');
    }
    TM.model = await tmPose.load(u + 'model.json', u + 'metadata.json');
    TM.url = u; TM.classes = TM.model.getClassLabels();
    TM.cls = TM.classes.find(c => !/기본/.test(c)) || TM.classes[0];
    const t = ME.tm[ME.group] = ME.tm[ME.group] || {};
    if (t.model !== u) { t.model = u; ME.tests[ME.group] = []; }
    save(); er.textContent = '';
    render();
  } catch (e) {
    er.textContent = '모델을 불러오지 못했어요. [모델 업로드]를 눌렀는지, 링크를 끝까지 복사했는지 확인해요.';
  } finally { const b = $('#mLoad'); if (b) b.disabled = false; }
}
function bindT3() {
  $('#mLoad').onclick = loadModel;
  if (!TM.classes.length) return bindF3();
  $('#tCls').onchange = e => { TM.cls = e.target.value; drawProbs(null); };
  $('#tSec').onchange = e => { TM.sec = Math.max(3, Math.min(30, Number(e.target.value) || 10)); e.target.value = TM.sec; };
  document.querySelectorAll('[data-tester]').forEach(b => b.onclick = () => { TM.who = b.dataset.tester; document.querySelectorAll('[data-tester]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#tStart').onclick = startTest;
  $('#tStop').onclick = () => finishTest(false, true);
  drawProbs(null); drawLog(); bindF3();
}
async function startTest() {
  if (TM.run) return;
  TM.cls = $('#tCls').value; TM.sec = Math.max(3, Math.min(30, Number($('#tSec').value) || 10));
  const cam = $('#cam');
  try {
    if (!TM.webcam) { TM.webcam = new tmPose.Webcam(320, 320, true); await TM.webcam.setup(); await TM.webcam.play(); }
  } catch (e) { TM.webcam = null; $('#mErr').textContent = '카메라를 켜지 못했어요. 주소창 옆 카메라 아이콘에서 [허용]을 눌러요.'; return; }
  cam.innerHTML = '<canvas width="320" height="320" aria-label="카메라 화면"></canvas><div class="timer" id="tNum"></div><div class="pill" id="tPill">자세를 맞춰 주세요</div>';
  TM.ctx = cam.querySelector('canvas').getContext('2d');
  Object.assign(TM, { run: true, hist: [], held: 0, t0: performance.now(), last: performance.now() });
  $('#tStart').hidden = true; $('#tStop').hidden = false;
  TM.raf = requestAnimationFrame(loopTest);
}
async function loopTest(t) {
  if (!TM.run) return;
  const dt = Math.min((t - TM.last) / 1000, 0.25); TM.last = t;
  let pose, preds;
  try {
    TM.webcam.update();
    const est = await TM.model.estimatePose(TM.webcam.canvas);
    pose = est.pose; preds = await TM.model.predict(est.posenetOutput);
  } catch (e) { $('#mErr').textContent = 'AI가 자세를 읽지 못했어요. 다시 시작해 봐요.'; return finishTest(false, true); }
  if (!TM.run) return;
  TM.ctx.drawImage(TM.webcam.canvas, 0, 0);
  if (pose && tmPose.drawKeypoints) { tmPose.drawKeypoints(pose.keypoints, 0.5, TM.ctx); tmPose.drawSkeleton(pose.keypoints, 0.5, TM.ctx); }
  const tp = preds.find(p => p.className === TM.cls);
  TM.hist.push(tp ? tp.probability : 0); if (TM.hist.length > 6) TM.hist.shift();
  const ok = TM.hist.reduce((a, b) => a + b, 0) / TM.hist.length >= CONFIG.THRESHOLD;
  if (ok) TM.held += dt;
  const left = Math.max(0, TM.sec - TM.held), spent = (t - TM.t0) / 1000;
  $('#tNum').textContent = Math.ceil(left);
  const pill = $('#tPill'); pill.textContent = ok ? '인정! 그대로 유지해요' : '자세를 맞춰 주세요'; pill.classList.toggle('ok', ok);
  drawProbs(preds, ok);
  if (TM.held >= TM.sec) return finishTest(true);
  if (spent > CONFIG.TEST_LIMIT + TM.sec) return finishTest(false);
  TM.raf = requestAnimationFrame(loopTest);
}
function finishTest(ok, stopped) {
  if (!TM.run) return;
  TM.run = false; cancelAnimationFrame(TM.raf);
  const spent = Math.round((performance.now() - TM.t0) / 1000);
  if (!stopped) {
    (ME.tests[ME.group] = ME.tests[ME.group] || []).push({ cls: TM.cls, sec: TM.sec, who: TM.who, ok, spent });
    save();
  }
  const pill = $('#tPill');
  if (pill) { pill.textContent = stopped ? '멈췄어요' : ok ? `성공! ${spent}초 걸렸어요` : `${CONFIG.TEST_LIMIT + TM.sec}초 안에 못 채웠어요`; pill.classList.toggle('ok', !!ok); }
  $('#tStart').hidden = false; $('#tStop').hidden = true;
  drawLog();
}
function stopTest() {
  TM.run = false; cancelAnimationFrame(TM.raf);
  if (TM.webcam) { try { TM.webcam.stop(); } catch (e) {} TM.webcam = null; }
}
function drawProbs(preds, ok) {
  const box = $('#probs'); if (!box) return;
  const list = preds || TM.classes.map(c => ({ className: c, probability: 0 }));
  box.innerHTML = list.map(p => { const v = Math.round(p.probability * 100), t = p.className === TM.cls;
    return `<div class="pb ${t ? 'target' : ''} ${t && ok ? 'ok' : ''}"><span title="${esc(p.className)}">${esc(p.className)}</span><span class="t"><i style="width:${v}%"></i>${t ? '<span class="th"></span>' : ''}</span><span>${v}%</span></div>`; }).join('');
}
function summary() {
  const tests = ME.tests[ME.group] || [], by = {};
  tests.forEach(x => { const s = by[x.cls] = by[x.cls] || { sec: x.sec, mine: [0, 0], other: [0, 0] }; s.sec = x.sec; s[x.who][1]++; if (x.ok) s[x.who][0]++; });
  return by;
}
function crit() {
  const by = summary(), tm = ME.tm[ME.group] || {}, cls = Object.keys(by).filter(c => !/기본/.test(c));
  return [
    { ok: cls.length > 0 && cls.every(c => by[c].mine[0] + by[c].other[0] > 0), t: '시험한 동작마다 정한 초만큼 끊기지 않고 인증됐어요' },
    { ok: cls.length > 0 && cls.every(c => by[c].other[0] >= 2), t: '다른 모둠 친구 2명이 해도 성공했어요 (동작마다)' },
    { ok: !!tm.still, t: '아무것도 안 하고 서 있으면 시간이 줄지 않아요 (직접 해 보고 누르기)', btn: true }
  ];
}
function drawLog() {
  const box = $('#logBox'); if (!box) return;
  const tests = ME.tests[ME.group] || [];
  box.innerHTML = tests.length ? `<table class="log"><thead><tr><th scope="col">동작</th><th scope="col">초</th><th scope="col">시험한 사람</th><th scope="col">결과</th><th scope="col"><span class="small">지우기</span></th></tr></thead><tbody>
    ${tests.map((x, i) => `<tr><td>${esc(x.cls)}</td><td>${x.sec}</td><td>${x.who === 'other' ? '다른 모둠 친구' : '우리 모둠'}</td><td>${x.ok ? `<span class="okt">성공 (${x.spent}초)</span>` : '<span class="not">실패</span>'}</td><td><button type="button" class="back" data-del="${i}" aria-label="${i + 1}번째 기록 지우기" style="padding:0 6px">✕</button></td></tr>`).join('')}
  </tbody></table>` : '<p class="muted small">아직 시험 기록이 없어요. 위에서 시작을 눌러요.</p>';
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { tests.splice(Number(b.dataset.del), 1); save(); drawLog(); });
  const c = $('#crit');
  if (c) {
    c.innerHTML = crit().map((k, i) => k.btn
      ? `<div class="${k.ok ? 'ok' : ''}"><span class="dot">${IC.check}</span><span style="flex:1">${k.t}</span><button type="button" class="btn soft" id="still" style="min-height:40px;padding:6px 14px">${k.ok ? '취소' : '확인했어요'}</button></div>`
      : `<div class="${k.ok ? 'ok' : ''}"><span class="dot">${IC.check}</span><span>${k.t}</span></div>`).join('');
    const s = $('#still'); if (s) s.onclick = () => { const t = ME.tm[ME.group] = ME.tm[ME.group] || {}; t.still = !t.still; save(); drawLog(); };
  }
}
function bindF3() {
  const f = $('#f3');
  f.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f)), err = $('#err3'), tm = ME.tm[ME.group] || {};
    const by = summary(), cs = crit();
    const miss = needWho() || (!tm.model || !TM.classes.length ? '먼저 위 시험기에 모델 링크를 넣고 [불러오기]를 눌러요.' : !Object.keys(by).length ? '시험기로 한 번 이상 시험해요.' : !d.fix.trim() ? '고친 점을 써요.' : '');
    if (miss) { err.textContent = miss; return; }
    const passN = cs.filter(k => k.ok).length;
    if (passN < 3 && !f.dataset.warned) { f.dataset.warned = '1'; err.textContent = `통과 기준이 ${passN}개만 채워졌어요. 그래도 내려면 한 번 더 누르세요.`; return; }
    err.textContent = ''; lockForm(f, true);
    const tests = Object.keys(by).map(c => `${c}(${by[c].sec}초): 우리 모둠 ${by[c].mine[0]}/${by[c].mine[1]}, 다른 모둠 ${by[c].other[0]}/${by[c].other[1]}`).join(' | ');
    const r = await api('submit', { code: ME.code, group: ME.group, task: 'tm', fields: {
      who: ME.who, model: tm.model, classes: TM.classes.join(', '), tests, checks: cs.map((k, i) => `${i + 1}${k.ok ? 'O' : 'X'}`).join(' '), fix: d.fix.trim() } });
    if (!r.ok) { err.innerHTML = errText(r); lockForm(f, false); return; }
    $('#box3').innerHTML = doneBox('모델 링크와 시험 기록이 선생님께 전달됐어요.', 't3');
    bindAgain(); loadStatus();
  };
}

render();
loadStatus();
</script>
</body>
