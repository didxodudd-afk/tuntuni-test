<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 동네 운동 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: phone-first single column, same look as 튼튼이365/index.html */
:root{
  --bg:#EDF3F0; --surface:#FFFFFF; --surface-2:#E1EBE6; --ink:#17302A; --muted:#566D66; --line:#CFDDD7;
  --accent:#F2643D; --accent-ink:#FFFFFF; --accent-soft:#FDE2D9;
  --teal:#16806A; --teal-soft:#D5EDE5; --sun:#E9A817; --sun-soft:#FDF0CC; --warn:#B4541F;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101816; --surface:#18231F; --surface-2:#22302B; --ink:#E5F0EB; --muted:#9AB2AA; --line:#2C3D37;
  --accent:#FF7A55; --accent-ink:#1A0E09; --accent-soft:#3D2620;
  --teal:#3FBF9C; --teal-soft:#1D3A32; --sun:#F7C24A; --sun-soft:#3A3120; --warn:#F09A6B; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em}
h2{font-size:26px;line-height:1.25}
h3{font-size:19px}
p{margin:0}
a{color:var(--teal)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--teal)}
.app{max-width:460px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.col{display:flex;flex-direction:column;gap:12px}
.draft{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:500}
.opt{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left}
.opt b{font-family:var(--display);font-weight:400;font-size:19px}
.opt small{font-size:13px;color:var(--muted)}
.opt.new{border:2px solid var(--accent);background:var(--accent-soft)}
.opt.new small{color:var(--ink)}
.opt .pill{align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px}
.cta{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:21px;padding:16px}
.ghost{width:100%;background:transparent;border:1px solid var(--line);border-radius:16px;font-family:var(--display);font-size:18px;padding:13px}
.back{align-self:flex-start;background:transparent;border:0;color:var(--muted);padding:4px 0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.notice{background:var(--teal-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.notice.warn{background:var(--accent-soft)}
#map{height:320px;border-radius:18px;border:1px solid var(--line);overflow:hidden;background:var(--surface-2);z-index:0}
.spot{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.spot.first{border:2px solid var(--accent)}
.spot b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.spot small{font-size:13px;color:var(--muted);display:block}
.spot .dist{font-family:var(--display);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.num{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:16px;border:2px solid #fff}
.first .num{background:var(--accent)}
.me{width:20px;height:20px;border-radius:50%;background:#2B6FD6;border:4px solid #fff;box-shadow:0 0 0 2px #2B6FD6}
.leaflet-div-icon{background:transparent;border:0}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;text-align:center;padding:12px;font-size:14px;color:var(--muted)}
.moves{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<main class="app">
  <p class="draft">시안이에요. 지도의 장소는 모두 예시이고, 실제 운동 장소가 아니에요.</p>

  <section id="s-place" class="col">
    <div><p class="eyebrow">2단계</p><h2>지금 어디에 있어?</h2></div>
    <button class="opt" data-old="교실"><b>교실</b><small>자리에서, 제자리에서</small></button>
    <button class="opt" data-old="운동장"><b>운동장</b><small>넓게 움직일 수 있어요</small></button>
    <button class="opt" data-old="집"><b>집</b><small>바닥에 눕거나 앉을 수 있어요</small></button>
    <button class="opt new" id="go-town"><span class="pill">새 탭</span><b>우리 동네</b><small>가까운 운동 장소를 찾아 줘요</small></button>
    <p class="notice" id="old-note" role="status" hidden></p>
  </section>

  <section id="s-ask" class="col" hidden>
    <button class="back" data-go="s-place">← 뒤로</button>
    <h2>가까운 운동 장소를 찾을까요?</h2>
    <div class="card">
      <p>내 위치는 이 기기에서 거리를 계산할 때만 써요.</p>
      <p class="muted">저장하지 않고, 선생님이나 기록 서버에도 보내지 않아요.</p>
    </div>
    <button class="cta" id="use-gps">내 위치 사용하기</button>
    <button class="ghost" id="pick-map">지도에서 직접 고르기</button>
    <p class="notice warn" id="gps-note" role="status" hidden></p>
  </section>

  <section id="s-map" class="col" hidden>
    <button class="back" data-go="s-ask">← 뒤로</button>
    <h2 id="map-title">율곡동 운동 장소</h2>
    <p class="notice" id="map-note" role="status"></p>
    <div id="map" role="region" aria-label="율곡동 지도. 같은 장소가 아래 목록에도 있어요."></div>
    <div class="col" id="spot-list"></div>
  </section>

  <section id="s-spot" class="col" hidden>
    <button class="back" data-go="s-map">← 지도로</button>
    <div><p class="eyebrow" id="spot-kind"></p><h2 id="spot-name"></h2><p class="muted" id="spot-dist"></p></div>
    <div id="spot-video"></div>
    <div class="card"><h3>여기서 할 수 있는 운동</h3><ol class="moves" id="spot-moves"></ol></div>
    <p class="notice">어른에게 어디로 가는지 말하고, 밝을 때 가요. 찻길을 건널 때는 휴대폰을 넣어 두어요.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================================
   선생님 설정: 여기만 고치면 돼요
   ===================================================================== */
const CENTER = [36.1245, 128.1862]; // 율곡동 (오픈스트리트맵 기준)
/* 장소 종류별 운동과 영상. video에 우리 반 유튜브 주소를 넣으면 앱 안에서 재생돼요. */
const KIND = {
  park:   {label:'공원', q:'어린이 야외 스트레칭', video:'', moves:['팔 크게 돌리기','큰 걸음 걷기','제자리 무릎 들기']},
  trail:  {label:'산책로', q:'걷기 전 스트레칭 어린이', video:'', moves:['빠르게 걷기 3분','걸으면서 어깨 돌리기','종아리 늘리기']},
  ground: {label:'운동장', q:'어린이 운동장 체조', video:'', moves:['가볍게 달리기','팔 벌려 뛰기','런지']},
  stairs: {label:'계단', q:'계단 운동 안전하게', video:'', moves:['손잡이 잡고 천천히 오르기','손잡이 잡고 뒤꿈치 들기','내려와서 다리 털기']}
};
/* 패들렛에 표시한 장소를 여기로 옮겨요. 지금은 모두 예시 자리예요. */
const SPOTS = [
  {name:'예시 장소 1', kind:'park',   lat:36.1272, lng:128.1832},
  {name:'예시 장소 2', kind:'trail',  lat:36.1228, lng:128.1905},
  {name:'예시 장소 3', kind:'ground', lat:36.1205, lng:128.1840},
  {name:'예시 장소 4', kind:'stairs', lat:36.1262, lng:128.1925},
  {name:'예시 장소 5', kind:'park',   lat:36.1300, lng:128.1880}
];
/* ===================================================================== */
const FAR_M = 5000;    // 이보다 멀면 "율곡동에서 멀어요" 안내
const ROUGH_M = 300;   // 위치 오차가 이보다 크면 정확하지 않다고 안내
const WALK_M_PER_MIN = 67;

const $ = id => document.getElementById(id);
const S = {me:null, map:null, meMarker:null, pins:[]};

function show(id){
  document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== id; });
  if(id === 's-map' && S.map) setTimeout(() => S.map.invalidateSize(), 0);
  window.scrollTo(0, 0);
}
function meters(a, b){
  const rad = d => d * Math.PI / 180, R = 6371000;
  const dLat = rad(b[0] - a[0]), dLng = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const distText = m => m < 1000 ? `${Math.round(m / 10) * 10}m` : `${(m / 1000).toFixed(1)}km`;
const walkText = m => `걸어서 약 ${Math.max(1, Math.round(m / WALK_M_PER_MIN))}분`;
const sorted = () => SPOTS
  .map(s => ({...s, m: S.me ? meters(S.me, [s.lat, s.lng]) : null}))
  .sort((a, b) => S.me ? a.m - b.m : 0);
const embedOf = u => { const m = (u || '').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/); return m ? 'https://www.youtube.com/embed/' + m[1] : ''; };
const ytSearch = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);

function initMap(){
  if(S.map || !window.L) return;
  S.map = L.map('map').setView(CENTER, 15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(S.map);
  S.map.on('click', e => setMe([e.latlng.lat, e.latlng.lng], '지도에서 고른 곳에서 가까운 순서예요. 다른 곳을 누르면 다시 찾아요.'));
}
function setMe(pos, note, warn){
  S.me = pos;
  if(S.map){
    if(S.meMarker) S.meMarker.setLatLng(pos);
    else S.meMarker = L.marker(pos, {title:'내 위치', icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[20,20]})}).addTo(S.map);
  }
  renderSpots(note, warn);
}
function renderSpots(note, warn){
  const list = sorted();
  $('map-note').textContent = note;
  $('map-note').classList.toggle('warn', !!warn);
  $('map-title').textContent = S.me ? '가까운 운동 장소' : '율곡동 운동 장소';
  const box = $('spot-list');
  box.replaceChildren();
  S.pins.forEach(p => p.remove());
  S.pins = [];
  list.forEach((s, i) => {
    const first = S.me && i === 0;
    const btn = document.createElement('button');
    btn.className = 'spot' + (first ? ' first' : '');
    const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
    const text = document.createElement('span');
    const name = document.createElement('b'); name.textContent = s.name;
    const sub = document.createElement('small'); sub.textContent = KIND[s.kind].label + (first ? ' · 가장 가까워요' : '');
    text.append(name, sub);
    const dist = document.createElement('span'); dist.className = 'dist'; dist.textContent = S.me ? distText(s.m) : '';
    btn.append(num, text, dist);
    btn.onclick = () => openSpot(s);
    box.append(btn);
    if(S.map){
      const pin = L.marker([s.lat, s.lng], {title:s.name, icon:L.divIcon({className:first ? 'first' : '', html:`<div class="num">${i + 1}</div>`, iconSize:[30,30]})}).addTo(S.map);
      pin.on('click', () => openSpot(s));
      S.pins.push(pin);
    }
  });
  if(S.map && S.me) S.map.fitBounds(L.latLngBounds([S.me, ...SPOTS.map(s => [s.lat, s.lng])]).pad(.15));
}
function openSpot(s){
  const k = KIND[s.kind];
  $('spot-kind').textContent = k.label;
  $('spot-name').textContent = s.name;
  $('spot-dist').textContent = S.me ? `직선으로 ${distText(s.m)} · ${walkText(s.m)}` : '';
  const box = $('spot-video'), url = embedOf(k.video);
  box.replaceChildren();
  if(url){
    const f = document.createElement('iframe');
    f.className = 'video'; f.src = url; f.title = `${k.label} 운동 영상`; f.allowFullscreen = true;
    box.append(f);
  } else {
    const d = document.createElement('div'); d.className = 'video';
    const inner = document.createElement('div');
    const p = document.createElement('p'); p.textContent = `우리 반 ${k.label} 운동 영상이 들어갈 자리예요.`;
    const a = document.createElement('a'); a.href = ytSearch(k.q); a.target = '_blank'; a.rel = 'noopener'; a.textContent = '유튜브에서 비슷한 영상 찾아보기';
    inner.append(p, a); d.append(inner); box.append(d);
  }
  $('spot-moves').replaceChildren(...k.moves.map(t => { const li = document.createElement('li'); li.textContent = t; return li; }));
  show('s-spot');
}
function openMap(){
  show('s-map');
  initMap();
  if(S.map) S.map.invalidateSize();
}
function pickOnMap(){
  S.me = null;
  if(S.meMarker){ S.meMarker.remove(); S.meMarker = null; }
  openMap();
  if(S.map) S.map.setView(CENTER, 15);
  renderSpots(window.L ? '지도에서 지금 있는 곳을 눌러 보세요. 가까운 순서로 알려 줄게요.' : '지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요. 장소 목록은 아래에서 볼 수 있어요.', !window.L);
}
const GEO_ERR = {
  1:'위치 사용이 꺼져 있어요. 괜찮아요, 지도에서 직접 골라도 돼요.',
  2:'지금은 위치를 찾지 못했어요. 지도에서 직접 골라 주세요.',
  3:'위치를 찾는 데 시간이 너무 걸려요. 지도에서 직접 골라 주세요.'
};
function useGps(){
  const note = $('gps-note');
  note.hidden = true;
  if(!navigator.geolocation){
    note.textContent = '이 기기에서는 위치 기능을 쓸 수 없어요. 지도에서 직접 골라 주세요.';
    note.hidden = false;
    return;
  }
  $('use-gps').textContent = '위치 찾는 중…';
  navigator.geolocation.getCurrentPosition(p => {
    $('use-gps').textContent = '내 위치 사용하기';
    const pos = [p.coords.latitude, p.coords.longitude];
    openMap();
    const far = meters(pos, CENTER) > FAR_M, rough = p.coords.accuracy > ROUGH_M;
    if(far) setMe(pos, '율곡동에서 멀리 있어요. 지금 위치가 맞지 않다면 지도에서 있는 곳을 눌러 주세요.', true);
    else if(rough) setMe(pos, '위치가 정확하지 않을 수 있어요. 틀리면 지도에서 있는 곳을 눌러 주세요.', true);
    else setMe(pos, '내 위치에서 가까운 순서예요. 틀리면 지도에서 있는 곳을 눌러 주세요.');
  }, e => {
    $('use-gps').textContent = '내 위치 사용하기';
    note.textContent = GEO_ERR[e.code] || GEO_ERR[2];
    note.hidden = false;
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}

document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));
document.querySelectorAll('[data-old]').forEach(b => b.onclick = () => {
  $('old-note').textContent = `${b.dataset.old}은(는) 지금 앱에 이미 있어요. 이 시안에서는 "우리 동네"만 눌러 볼 수 있어요.`;
  $('old-note').hidden = false;
});
$('go-town').onclick = () => show('s-ask');
$('use-gps').onclick = useGps;
$('pick-map').onclick = pickOnMap;
</script>
</body>
</html>
